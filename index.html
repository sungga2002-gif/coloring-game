<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 공룡 색칠놀이 AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .color-bubble {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .color-bubble:hover, .color-bubble.active {
            transform: scale(1.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #canvasContainer {
            width: 100%;
            max-width: min(280px, 36vh);
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
        @keyframes dinoDance {
            0%, 100% { transform: scale(1) rotate(0deg) translateY(0); }
            20% { transform: scale(1.12) rotate(-12deg) translateY(-10px); }
            40% { transform: scale(0.95) rotate(12deg) translateY(5px); }
            60% { transform: scale(1.12) rotate(-8deg) translateY(-15px); }
            80% { transform: scale(1.05) rotate(8deg) translateY(-3px); }
        }
        @keyframes dinoBurp {
            0%, 100% { transform: scale(1) translateY(0); }
            30% { transform: scale(1.25, 0.85) translateY(8px); filter: hue-rotate(45deg); }
            60% { transform: scale(0.85, 1.2) translateY(-12px); }
        }
        @keyframes dinoFire {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-5deg); filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.8)); }
        }
        .dino-dance { animation: dinoDance 1s infinite ease-in-out; }
        .dino-burp { animation: dinoBurp 0.9s infinite ease-in-out; }
        .dino-fire { animation: dinoFire 0.8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 h-screen flex flex-col justify-between overflow-hidden">

    <!-- 첫 화면 (홈) -->
    <div id="homeScreen" class="fixed inset-0 bg-gradient-to-b from-sky-300 via-amber-100 to-emerald-200 z-50 flex flex-col items-center justify-between p-6 transition-opacity duration-700">
        <div class="w-full max-w-md flex justify-between items-center z-10">
            <button id="homeLangBtn" class="bg-white/80 hover:bg-white text-emerald-800 px-3.5 py-1.5 rounded-full font-bold text-sm shadow-md border border-white flex items-center gap-1.5">
                <span id="homeLangFlag">🇰🇷</span> <span id="homeLangText">한국어</span>
            </button>
            <div class="flex gap-2">
                <button id="openRankingHomeBtn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-3.5 py-1.5 rounded-full font-bold text-sm shadow-md border border-white flex items-center gap-1.5">
                    <i class="fa-solid fa-trophy"></i> 랭킹
                </button>
            </div>
        </div>

        <div class="text-center z-10 my-auto">
            <div class="inline-block bg-white/95 px-6 py-3 rounded-full shadow-lg border-2 border-yellow-300 mb-4 animate-bounce">
                <span class="text-xs sm:text-sm font-extrabold text-amber-600 tracking-wider">알록달록 AI 공룡 월드</span>
            </div>
            <h1 class="text-3xl sm:text-5xl font-black text-emerald-700 drop-shadow-md tracking-wide leading-tight">
                귀여운 공룡 색칠놀이 🎨
            </h1>
            <p class="text-slate-600 text-sm sm:text-base font-bold mt-3">
                터치해서 공룡 친구들을 만나러 가요!
            </p>
        </div>

        <div class="w-full max-w-xs z-10 mb-6">
            <button id="startGameBtn" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-600 hover:to-teal-700 text-white text-xl sm:text-2xl font-black rounded-3xl shadow-xl border-4 border-yellow-300 transform active:scale-95 transition flex items-center justify-center gap-3 animate-pulse">
                <i class="fa-solid fa-play text-yellow-300"></i> <span id="startBtnText">게임 시작하기 🎨</span>
            </button>
        </div>
    </div>

    <!-- 상단 헤더 -->
    <header class="bg-emerald-500 text-white shadow-md px-3 py-1 text-center z-20 rounded-b-2xl shrink-0">
        <div class="max-w-md mx-auto flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <button id="mainHomeBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white w-6 h-6 rounded-full border border-emerald-400 flex items-center justify-center shadow-sm active:scale-95 transition" title="홈으로">
                    <i class="fa-solid fa-house text-[10px]"></i>
                </button>
                <h1 class="text-sm font-bold flex items-center gap-1 tracking-wide">
                    <i class="fa-solid fa-dragon text-yellow-300"></i> <span id="appHeaderTitle">공룡 색칠놀이</span>
                </h1>
            </div>
            <div class="flex items-center gap-1">
                <button id="openRankingHeaderBtn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm transition active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-trophy"></i> 랭킹
                </button>
                <button id="langToggleBtn" class="bg-emerald-600 hover:bg-emerald-700 text-[10px] px-2 py-0.5 rounded-full border border-emerald-400 text-yellow-200 font-bold transition flex items-center gap-1 shadow-sm active:scale-95">
                    <span id="langFlag">🇰🇷</span> <span id="langLabel">한국어</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 작업 영역 -->
    <main class="flex-1 max-w-md w-full mx-auto px-3 py-1 flex flex-col justify-around items-center overflow-hidden">
        <!-- 공룡 선택 및 이동 바 -->
        <div class="w-full flex justify-between items-center bg-white px-3 py-1 rounded-xl shadow-sm border border-amber-200 shrink-0">
            <button id="prevBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-2 py-0.5 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                <i class="fa-solid fa-chevron-left"></i> <span id="prevBtnText">이전</span>
            </button>
            <div class="text-center">
                <span id="dinoName" class="text-xs sm:text-sm font-bold text-emerald-700">1. 티라노사우루스</span>
            </div>
            <button id="nextBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-2 py-0.5 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                <span id="nextBtnText">다음</span> <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- 캔버스 컨테이너 -->
        <div id="canvasContainer" class="relative rounded-2xl shadow-md border-3 border-amber-300 overflow-hidden flex items-center justify-center shrink-0 bg-white">
            <canvas id="colorCanvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
            <canvas id="outlineCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
            
            <div id="reactionOverlay" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center transition-all duration-500 opacity-0 z-10 bg-black/10">
                <div id="reactionEmoji" class="text-4xl animate-bounce mb-1">🔥</div>
                <div id="reactionText" class="bg-white/95 px-3 py-1 rounded-xl shadow-lg text-emerald-700 font-extrabold text-xs sm:text-sm border-2 border-yellow-400">
                    불뿜기 대성공! 뿜뿜~ 🔥
                </div>
            </div>
        </div>

        <!-- 안내 문구 -->
        <div id="voiceFeedbackBadge" class="w-full bg-amber-100 text-amber-900 px-2.5 py-0.5 rounded-xl font-bold text-[11px] text-center flex items-center justify-center gap-1 border border-amber-300 shrink-0">
            <i class="fa-solid fa-paintbrush text-emerald-600 animate-pulse"></i>
            <span id="voiceStatusText">공룡(50점)과 배경까지(120점) 예쁘게 칠해봐요! 🦖✨</span>
        </div>

        <!-- 컬러 팔레트 (색상 선택) -->
        <div class="w-full bg-white px-3 py-1 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-0.5 shrink-0">
            <div class="text-[10px] font-bold text-slate-500 px-0.5 flex justify-between items-center">
                <span>🎨 색상 고르기</span>
                <span id="selectedColorIndicator" class="w-3 h-3 rounded-full inline-block border border-slate-300" style="background-color: #ef4444;"></span>
            </div>
            <div class="flex justify-between items-center gap-1 px-0.5">
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-red-500 active" data-color="#ef4444"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-orange-500" data-color="#f97316"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-yellow-400" data-color="#facc15"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-green-500" data-color="#22c55e"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-blue-500" data-color="#3b82f6"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-indigo-500" data-color="#6366f1"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-purple-500" data-color="#a855f7"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-pink-500" data-color="#ec4899"></div>
                <div class="color-bubble w-5 h-5 sm:w-6 sm:h-6 rounded-full cursor-pointer border-2 border-white shadow active scale-95 bg-amber-800" data-color="#92400e"></div>
            </div>
        </div>

        <!-- 하단 도구 및 완료 버튼 -->
        <div class="w-full bg-white px-3 py-1.5 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1 shrink-0">
            <div class="flex justify-around items-center gap-1.5">
                <button id="toolBrush" class="tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-emerald-500 text-white shadow-sm">
                    <i class="fa-solid fa-paintbrush text-xs"></i> <span id="btnBrushText">붓</span>
                </button>
                <button id="toolEraser" class="tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                    <i class="fa-solid fa-eraser text-xs"></i> <span id="btnEraserText">지우개</span>
                </button>
                <button id="toolReset" class="tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                    <i class="fa-solid fa-rotate-right text-xs"></i> <span id="btnResetText">다시하기</span>
                </button>
                <button id="toolComplete" class="tool-btn flex-[1.4] py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-yellow-950 shadow-md border border-yellow-300">
                    <i class="fa-solid fa-star text-xs animate-spin"></i> <span id="btnCompleteText">완료! 🌟</span>
                </button>
            </div>
            <!-- 붓 두께 슬라이더 -->
            <div class="flex items-center gap-2 px-1">
                <span class="text-[10px] font-bold text-slate-500 whitespace-nowrap" id="brushSizeLabel">두께:</span>
                <input type="range" id="brushSizeRange" min="10" max="50" value="25" class="w-full accent-emerald-500 cursor-pointer h-1">
            </div>
        </div>
    </main>

    <!-- 점수 및 리액션 결과 모달 -->
    <div id="scoreModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="scoreModalCard" class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-yellow-300 transform scale-90 transition-transform duration-300 flex flex-col gap-4">
            <div id="modalEmoji" class="text-6xl animate-bounce">🏆</div>
            <div>
                <span id="praiseBadge" class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider">최고의 화가!</span>
                <h2 id="scoreValue" class="text-3xl font-black text-emerald-600 mt-2">120점</h2>
                <p id="praiseMessage" class="text-slate-600 text-sm font-bold mt-2">공룡과 배경까지 완벽하게 칠해서 창의성 만점 120점 달성!</p>
            </div>
            <div id="rankingInputContainer" class="flex flex-col gap-2 pt-2 border-t border-slate-100">
                <input type="text" id="playerNameInput" placeholder="이름을 입력하세요 (예: 튼튼이)" class="w-full px-4 py-2.5 rounded-xl border-2 border-emerald-300 focus:outline-none focus:border-emerald-500 font-bold text-center text-sm">
                <button onclick="saveCurrentScoreToRanking()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl shadow-md transition active:scale-95">
                    랭킹에 이름 올리기 🚀
                </button>
            </div>
            <button onclick="closeScoreModal()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
                계속 색칠하기 🎨
            </button>
        </div>
    </div>

    <!-- 랭킹 보드 모달 -->
    <div id="rankingModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="rankingModalCard" class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border-4 border-yellow-300 transform scale-90 transition-transform duration-300 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-xl font-black text-emerald-700 flex items-center gap-2"><i class="fa-solid fa-trophy text-yellow-400"></i> 명예의 랭킹</h2>
                <button onclick="closeRankingModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="rankingListContainer" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1">
            </div>
            <button onclick="closeRankingModal()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-md transition">
                닫기
            </button>
        </div>
    </div>

    <script>
        const TRANSLATIONS = {
            ko: {
                appHeaderTitle: "공룡 색칠놀이",
                startBtnText: "게임 시작하기 🎨",
                homeSubtitle: "터치해서 공룡 친구들을 만나러 가요!",
                prevBtn: "이전",
                nextBtn: "다음",
                btnBrushText: "붓",
                btnEraserText: "지우개",
                btnResetText: "다시하기",
                btnCompleteText: "완료! 🌟",
                brushSizeLabel: "두께:",
                voiceStatusText: "공룡(50점)과 배경(120점)을 모두 예쁘게 칠해보세요! 🦖✨",
                dinoNames: [
                    "1. 티라노사우루스",
                    "2. 트리케라톱스",
                    "3. 브라키오사우루스",
                    "4. 프테라노돈",
                    "5. 스테고사우루스"
                ],
                praiseHigh: "창의력 대장 화가!",
                praiseMid: "멋진 꼬마 화가!",
                praiseLow: "알록달록 화가!",
                msg120: "공룡과 배경(해, 구름)까지 완벽하게 채색하여 창의성 120점 만점 달성!",
                msg100: "공룡 몸통과 배경을 골고루 칠해주었어요! (100점)",
                msg50: "공룡 위주로 예쁘게 잘 칠했어요! (50점)"
            },
            en: {
                appHeaderTitle: "Dino Coloring",
                startBtnText: "Start Game 🎨",
                homeSubtitle: "Touch to meet cute dinosaur friends!",
                prevBtn: "Prev",
                nextBtn: "Next",
                btnBrushText: "Brush",
                btnEraserText: "Eraser",
                btnResetText: "Reset",
                btnCompleteText: "Done! 🌟",
                brushSizeLabel: "Size:",
                voiceStatusText: "Color both the dinosaur and background! 🦖✨",
                dinoNames: [
                    "1. Tyrannosaurus",
                    "2. Triceratops",
                    "3. Brachiosaurus",
                    "4. Pteranodon",
                    "5. Stegosaurus"
                ],
                praiseHigh: "Creative Master!",
                praiseMid: "Wonderful Artist!",
                praiseLow: "Lovely Painter!",
                msg120: "Amazing! You colored the dinosaur and background for 120 points!",
                msg100: "You colored the dinosaur and background nicely! (100 pts)",
                msg50: "Good job coloring the dinosaur! (50 pts)"
            }
        };

        let currentLang = 'ko';
        let currentDinoIndex = 0;
        let currentColor = '#ef4444';
        let currentTool = 'brush';
        let brushSize = 25;
        let isDrawing = false;
        let lastScore = 100;

        const homeScreen = document.getElementById('homeScreen');
        const startGameBtn = document.getElementById('startGameBtn');
        const colorCanvas = document.getElementById('colorCanvas');
        const outlineCanvas = document.getElementById('outlineCanvas');
        const ctxColor = colorCanvas.getContext('2d');
        const ctxOutline = outlineCanvas.getContext('2d');

        function initCanvasSize() {
            const size = 500;
            colorCanvas.width = size;
            colorCanvas.height = size;
            outlineCanvas.width = size;
            outlineCanvas.height = size;
            drawCurrentDinoAndBackground();
        }

        // 공룡 및 배경(해, 구름, 풀숲) 정성스러운 드로잉
        function drawCurrentDinoAndBackground() {
            ctxOutline.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
            ctxOutline.strokeStyle = '#1e293b';
            ctxOutline.lineWidth = 7;
            ctxOutline.lineCap = 'round';
            ctxOutline.lineJoin = 'round';

            const cx = 250, cy = 250;

            // --- 1. 배경 요소 (해, 구름, 풀숲) ---
            ctxOutline.beginPath();
            ctxOutline.arc(410, 80, 32, 0, Math.PI * 2);
            for(let i=0; i<8; i++) {
                let angle = (i * Math.PI) / 4;
                let x1 = 410 + Math.cos(angle) * 38;
                let y1 = 80 + Math.sin(angle) * 38;
                let x2 = 410 + Math.cos(angle) * 52;
                let y2 = 80 + Math.sin(angle) * 52;
                ctxOutline.moveTo(x1, y1); ctxOutline.lineTo(x2, y2);
            }
            ctxOutline.stroke();

            // 구름
            ctxOutline.beginPath();
            ctxOutline.arc(80, 85, 18, 0, Math.PI * 2);
            ctxOutline.arc(108, 75, 22, 0, Math.PI * 2);
            ctxOutline.arc(135, 90, 16, 0, Math.PI * 2);
            ctxOutline.stroke();

            // 바닥 풀숲
            ctxOutline.beginPath();
            ctxOutline.moveTo(40, 460); ctxOutline.lineTo(460, 460);
            ctxOutline.moveTo(70, 460); ctxOutline.lineTo(85, 425); ctxOutline.lineTo(100, 460);
            ctxOutline.moveTo(190, 460); ctxOutline.lineTo(210, 415); ctxOutline.lineTo(230, 460);
            ctxOutline.moveTo(340, 460); ctxOutline.lineTo(360, 420); ctxOutline.lineTo(380, 460);
            ctxOutline.stroke();


            // --- 2. 개성 넘치는 공룡 캐릭터 외곽선 ---
            ctxOutline.beginPath();

            if (currentDinoIndex === 0) {
                // 1. 티라노사우루스
                ctxOutline.moveTo(cx - 50, cy - 80);
                ctxOutline.lineTo(cx + 70, cy - 70);
                ctxOutline.lineTo(cx + 80, cy - 40);
                ctxOutline.lineTo(cx + 20, cy - 20);
                ctxOutline.lineTo(cx + 60, cy + 50);
                ctxOutline.lineTo(cx + 90, cy + 130);
                ctxOutline.lineTo(cx + 50, cy + 130);
                ctxOutline.lineTo(cx + 20, cy + 70);
                ctxOutline.lineTo(cx - 40, cy + 130);
                ctxOutline.lineTo(cx - 80, cy + 130);
                ctxOutline.lineTo(cx - 60, cy + 60);
                ctxOutline.lineTo(cx - 130, cy + 20);
                ctxOutline.lineTo(cx - 60, cy - 40);
                ctxOutline.closePath();
                ctxOutline.fillStyle = '#1e293b';
                ctxOutline.beginPath(); ctxOutline.arc(cx + 35, cy - 55, 6, 0, Math.PI * 2); ctxOutline.fill();
            } 
            else if (currentDinoIndex === 1) {
                // 2. 트리케라톱스
                ctxOutline.arc(cx, cy + 20, 75, 0, Math.PI * 2);
                ctxOutline.moveTo(cx - 35, cy - 40);
                ctxOutline.bezierCurveTo(cx - 95, cy - 110, cx + 95, cy - 110, cx + 35, cy - 40);
                ctxOutline.moveTo(cx + 45, cy - 65); ctxOutline.lineTo(cx + 80, cy - 90); ctxOutline.lineTo(cx + 55, cy - 45);
                ctxOutline.moveTo(cx - 10, cy - 75); ctxOutline.lineTo(cx - 20, cy - 105); ctxOutline.lineTo(cx + 10, cy - 65);
                ctxOutline.moveTo(cx - 70, cy + 40); ctxOutline.lineTo(cx - 100, cy + 50);
                ctxOutline.stroke();
                ctxOutline.fillStyle = '#1e293b';
                ctxOutline.beginPath(); ctxOutline.arc(cx + 25, cy - 20, 6, 0, Math.PI * 2); ctxOutline.fill();
            } 
            else if (currentDinoIndex === 2) {
                // 3. 브라키오사우루스
                ctxOutline.moveTo(cx - 30, cy + 80);
                ctxOutline.lineTo(cx - 30, cy - 80);
                ctxOutline.arc(cx - 15, cy - 95, 18, Math.PI, Math.PI * 2.5);
                ctxOutline.ellipse(cx + 30, cy + 40, 75, 50, 0, 0, Math.PI * 2);
                ctxOutline.moveTo(cx + 100, cy + 40); ctxOutline.lineTo(cx + 150, cy + 70);
                ctxOutline.stroke();
                ctxOutline.fillStyle = '#1e293b';
                ctxOutline.beginPath(); ctxOutline.arc(cx - 5, cy - 98, 5, 0, Math.PI * 2); ctxOutline.fill();
            } 
            else if (currentDinoIndex === 3) {
                // 4. 프테라노돈
                ctxOutline.ellipse(cx, cy + 20, 30, 45, 0, 0, Math.PI * 2);
                ctxOutline.moveTo(cx, cy - 25); ctxOutline.lineTo(cx - 85, cy - 55);
                ctxOutline.moveTo(cx, cy - 25); ctxOutline.lineTo(cx + 45, cy - 65);
                ctxOutline.moveTo(cx - 15, cy); ctxOutline.lineTo(cx - 150, cy - 15); ctxOutline.lineTo(cx - 40, cy + 45);
                ctxOutline.moveTo(cx + 15, cy); ctxOutline.lineTo(cx + 150, cy - 15); ctxOutline.lineTo(cx + 40, cy + 45);
                ctxOutline.stroke();
                ctxOutline.fillStyle = '#1e293b';
                ctxOutline.beginPath(); ctxOutline.arc(cx - 20, cy - 35, 5, 0, Math.PI * 2); ctxOutline.fill();
            } 
            else {
                // 5. 스테고사우루스 (등의 뾰족한 골판이 살아있는 정성스러운 모양)
                ctxOutline.ellipse(cx, cy + 20, 85, 55, 0, 0, Math.PI * 2);
                ctxOutline.arc(cx - 90, cy + 15, 18, 0, Math.PI * 2);
                // 등에 뾰족한 삼각형 골판들
                ctxOutline.moveTo(cx - 65, cy - 35); ctxOutline.lineTo(cx - 75, cy - 85); ctxOutline.lineTo(cx - 40, cy - 40);
                ctxOutline.moveTo(cx - 25, cy - 40); ctxOutline.lineTo(cx - 30, cy - 90); ctxOutline.lineTo(cx + 5, cy - 40);
                ctxOutline.moveTo(cx + 20, cy - 40); ctxOutline.lineTo(cx + 25, cy - 90); ctxOutline.lineTo(cx + 55, cy - 40);
                ctxOutline.stroke();
                ctxOutline.fillStyle = '#1e293b';
                ctxOutline.beginPath(); ctxOutline.arc(cx - 95, cy + 10, 5, 0, Math.PI * 2); ctxOutline.fill();
            }

            ctxOutline.stroke();
        }

        // 그리기 이벤트 핸들러
        function getTouchPos(e) {
            const rect = colorCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (colorCanvas.width / rect.width),
                y: (clientY - rect.top) * (colorCanvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getTouchPos(e);
            ctxColor.beginPath();
            ctxColor.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getTouchPos(e);
            ctxColor.lineTo(pos.x, pos.y);
            ctxColor.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            ctxColor.lineWidth = brushSize;
            ctxColor.lineCap = 'round';
            ctxColor.lineJoin = 'round';
            ctxColor.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        colorCanvas.addEventListener('mousedown', startDrawing);
        colorCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        colorCanvas.addEventListener('touchstart', startDrawing, { passive: false });
        colorCanvas.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        startGameBtn.addEventListener('click', () => {
            homeScreen.classList.add('opacity-0', 'pointer-events-none');
            initCanvasSize();
        });

        document.getElementById('mainHomeBtn').addEventListener('click', () => {
            homeScreen.classList.remove('opacity-0', 'pointer-events-none');
        });

        document.querySelectorAll('.color-bubble').forEach(bubble => {
            bubble.addEventListener('click', (e) => {
                document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('active', 'ring-4', 'ring-emerald-400'));
                e.target.classList.add('active', 'ring-4', 'ring-emerald-400');
                currentColor = e.target.getAttribute('data-color');
                document.getElementById('selectedColorIndicator').style.backgroundColor = currentColor;
                currentTool = 'brush';
                updateToolUI();
            });
        });

        document.getElementById('toolBrush').addEventListener('click', () => {
            currentTool = 'brush';
            updateToolUI();
        });
        document.getElementById('toolEraser').addEventListener('click', () => {
            currentTool = 'eraser';
            updateToolUI();
        });
        document.getElementById('toolReset').addEventListener('click', () => {
            if(confirm("색칠한 내용을 모두 지울까요?")) {
                ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
            }
        });

        function updateToolUI() {
            const bBtn = document.getElementById('toolBrush');
            const eBtn = document.getElementById('toolEraser');
            if(currentTool === 'brush') {
                bBtn.className = "tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-emerald-500 text-white shadow-sm";
                eBtn.className = "tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200";
            } else {
                eBtn.className = "tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-emerald-500 text-white shadow-sm";
                bBtn.className = "tool-btn flex-1 py-1 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200";
            }
        }

        document.getElementById('brushSizeRange').addEventListener('input', (e) => {
            brushSize = e.target.value;
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDinoIndex = (currentDinoIndex + 1) % 5;
            updateDinoInfo();
        });
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDinoIndex = (currentDinoIndex - 4) % 5;
            updateDinoInfo();
        });

        function updateDinoInfo() {
            const t = TRANSLATIONS[currentLang];
            document.getElementById('dinoName').textContent = t.dinoNames[currentDinoIndex];
            ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
            drawCurrentDinoAndBackground();
        }

        document.getElementById('langToggleBtn').addEventListener('click', toggleLanguage);
        document.getElementById('homeLangBtn').addEventListener('click', toggleLanguage);

        function toggleLanguage() {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            const t = TRANSLATIONS[currentLang];
            
            document.getElementById('langFlag').textContent = currentLang === 'ko' ? '🇰🇷' : '🇺🇸';
            document.getElementById('langLabel').textContent = currentLang === 'ko' ? '한국어' : 'English';
            document.getElementById('homeLangFlag').textContent = currentLang === 'ko' ? '🇰🇷' : '🇺🇸';
            document.getElementById('homeLangText').textContent = currentLang === 'ko' ? '한국어' : 'English';
            
            document.getElementById('appHeaderTitle').textContent = t.appHeaderTitle;
            document.getElementById('startBtnText').textContent = t.startBtnText;
            document.getElementById('homeSubtitle').textContent = t.homeSubtitle;
            document.getElementById('prevBtnText').textContent = t.prevBtn;
            document.getElementById('nextBtnText').textContent = t.nextBtn;
            document.getElementById('btnBrushText').textContent = t.btnBrushText;
            document.getElementById('btnEraserText').textContent = t.btnEraserText;
            document.getElementById('btnResetText').textContent = t.btnResetText;
            document.getElementById('btnCompleteText').textContent = t.btnCompleteText;
            document.getElementById('brushSizeLabel').textContent = t.brushSizeLabel;
            document.getElementById('voiceStatusText').textContent = t.voiceStatusText;
            updateDinoInfo();
        }

        // --- 채점 알고리즘 (요청하신 기준 적용) ---
        // 공룡만 칠함: 50점 / 공룡+배경 골고루 칠함: 100점 / 해·구름·풀숲까지 완벽 채색: 120점 만점
        function calculateScoreAndEvaluate() {
            const imgData = ctxColor.getImageData(0, 0, colorCanvas.width, colorCanvas.height).data;
            let totalPaintedPixels = 0;
            let bgPaintedPixels = 0;     // 배경 영역 (상단 해/구름, 하단 풀숲)

            for (let y = 0; y < colorCanvas.height; y++) {
                for (let x = 0; x < colorCanvas.width; x++) {
                    const idx = (y * colorCanvas.width + x) * 4;
                    const r = imgData[idx];
                    const g = imgData[idx+1];
                    const b = imgData[idx+2];
                    const a = imgData[idx+3];

                    if (a > 50 && !(r > 245 && g > 245 && b > 245)) {
                        totalPaintedPixels++;
                        // 바깥쪽 배경 영역 판정
                        const dx = x - 250, dy = y - 250;
                        const distFromCenter = Math.sqrt(dx*dx + dy*dy);
                        if (distFromCenter > 90) {
                            bgPaintedPixels++;
                        }
                    }
                }
            }

            let score = 50; 
            let badgeText = TRANALATIONS_EVAL('low');
            let msgText = TRANSLATIONS[currentLang].msg50;

            if (totalPaintedPixels > 2500 && bgPaintedPixels > 400) {
                score = 120; // 창의성 만점
                badgeText = TRANALATIONS_EVAL('high');
                msgText = TRANSLATIONS[currentLang].msg120;
            } else if (totalPaintedPixels > 1000 && bgPaintedPixels > 100) {
                score = 100; // 배경 포함
                badgeText = TRANALATIONS_EVAL('mid');
                msgText = TRANSLATIONS[currentLang].msg100;
            } else {
                score = 50; // 공룡 위주
                badgeText = TRANALATIONS_EVAL('low');
                msgText = TRANSLATIONS[currentLang].msg50;
            }

            lastScore = score;
            return { score, badgeText, msgText };
        }

        function TRANALATIONS_EVAL(type) {
            if(currentLang === 'ko') {
                if(type === 'high') return "창의력 대장 화가!";
                if(type === 'mid') return "멋진 꼬마 화가!";
                return "알록달록 화가!";
            } else {
                if(type === 'high') return "Creative Master!";
                if(type === 'mid') return "Wonderful Artist!";
                return "Lovely Painter!";
            }
        }

        // 완료 버튼 및 리액션 애니메이션 연출
        document.getElementById('toolComplete').addEventListener('click', () => {
            const overlay = document.getElementById('reactionOverlay');
            const emoji = document.getElementById('reactionEmoji');
            const text = document.getElementById('reactionText');
            
            const reactions = [
                { emoji: "🔥", text: "공룡이 신나서 불뿜기 발사! 뿜뿜~ 🔥", anim: "dino-fire" },
                { emoji: "💨", text: "뿌우웅~ 방귀 대폭발 기가 막히죠? 😆", anim: "dino-burp" },
                { emoji: "💃", text: "신나는 음악에 맞춰 댄스파티 시작! ✨", anim: "dino-dance" }
            ];
            const r = reactions[Math.floor(Math.random() * reactions.length)];
            
            emoji.textContent = r.emoji;
            text.textContent = r.text;
            
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('canvasContainer').classList.add(r.anim);
            
            if (typeof confetti === 'function') {
                confetti({ particleCount: 130, spread: 90, origin: { y: 0.6 } });
            }

            setTimeout(() => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('canvasContainer').classList.remove('dino-fire', 'dino-burp', 'dino-dance');
                
                const evaluation = calculateScoreAndEvaluate();
                showScoreModal(evaluation.score, evaluation.badgeText, evaluation.msgText);
            }, 2000);
        });

        function showScoreModal(score, badge, msg) {
            document.getElementById('scoreValue').textContent = `${score}점`;
            document.getElementById('praiseBadge').textContent = badge;
            document.getElementById('praiseMessage').textContent = msg;
            
            document.getElementById('scoreModal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('scoreModalCard').classList.remove('scale-90');
            document.getElementById('scoreModalCard').classList.add('scale-100');
        }

        function closeScoreModal() {
            document.getElementById('scoreModal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('scoreModalCard').classList.remove('scale-100');
            document.getElementById('scoreModalCard').classList.add('scale-90');
        }

        function showRankingModal() {
            renderRankingList();
            document.getElementById('rankingModal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('rankingModalCard').classList.remove('scale-90');
            document.getElementById('rankingModalCard').classList.add('scale-100');
        }

        function closeRankingModal() {
            document.getElementById('rankingModal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('rankingModalCard').classList.remove('scale-100');
            document.getElementById('rankingModalCard').classList.add('scale-90');
        }

        document.getElementById('openRankingHeaderBtn').addEventListener('click', showRankingModal);
        document.getElementById('openRankingHomeBtn').addEventListener('click', showRankingModal);

        function saveCurrentScoreToRanking() {
            const nameInput = document.getElementById('playerNameInput');
            const name = nameInput.value.trim() || '꼬마 화가';
            const dinoName = TRANSLATIONS[currentLang].dinoNames[currentDinoIndex].split(' ')[1];
            
            let rankings = JSON.parse(localStorage.getItem('dino_rankings') || '[]');
            rankings.push({ name: name, score: lastScore, dino: dinoName, date: new Date().toLocaleDateString() });
            rankings.sort((a, b) => b.score - a.score);
            rankings = rankings.slice(0, 10);
            
            localStorage.setItem('dino_rankings', JSON.stringify(rankings));
            nameInput.value = '';
            closeScoreModal();
            showRankingModal();
        }

        function renderRankingList() {
            const container = document.getElementById('rankingListContainer');
            container.innerHTML = '';
            let rankings = JSON.parse(localStorage.getItem('dino_rankings') || '[]');
            
            if (rankings.length === 0) {
                container.innerHTML = '<div class="text-center py-6 text-slate-400 font-bold">아직 등록된 랭킹이 없어요!<br>완료하고 이름을 올려보세요 🏆</div>';
                return;
            }
            
            rankings.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `flex justify-between items-center p-2.5 rounded-xl ${index === 0 ? 'bg-yellow-100 font-bold text-yellow-900 border border-yellow-300' : 'bg-slate-50'}`;
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-6 text-center text-emerald-700 font-black">${index + 1}등</span>
                        <span>${item.name} <span class="text-[10px] text-slate-500">(${item.dino})</span></span>
                    </div>
                    <span class="text-emerald-600 font-extrabold">${item.score}점</span>
                `;
                container.appendChild(row);
            });
        }

        window.onload = initCanvasSize;
    </script>
</body>
