<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1~4세 아기를 위한 AI 공룡 색칠놀이 웹 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcf8f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dino-game-wrapper {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            background-color: #fffdf5;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 3px solid #fde68a;
        }
        .color-bubble {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .color-bubble:hover, .color-bubble.active {
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            z-index: 10;
        }
        .canvas-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fcd34d;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="dino-game-wrapper flex flex-col gap-3">

        <!-- 🚀 1. 시작 메인 페이지 화면 -->
        <div id="startScreen" class="flex flex-col items-center justify-center py-12 px-4 text-center gap-6">
            <div class="text-7xl animate-bounce">🦖</div>
            <div>
                <h1 class="text-2xl font-black text-emerald-700">아기를 위한 공룡 색칠놀이</h1>
                <p class="text-slate-500 text-xs mt-2">공룡만(50점), 바탕까지(100점), 창의적표현(120점) 만점에 도전하세요!</p>
            </div>
            <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 font-black text-lg rounded-2xl shadow-lg border-2 border-yellow-300 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 색칠놀이 시작하기!
            </button>
        </div>

        <!-- 🎨 2. 게임 플레이 화면 -->
        <div id="gameScreen" class="hidden flex-col gap-3">
            <!-- 상단 헤더 & 스테이지 바 -->
            <div class="flex justify-between items-center bg-white px-3 py-2 rounded-xl shadow-sm border border-amber-200">
                <button id="prevBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-chevron-left"></i> 이전
                </button>
                <div class="text-center">
                    <span id="dinoName" class="text-sm font-black text-emerald-700">1. 티라노사우루스 (화산 배경)</span>
                </div>
                <button id="nextBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                    다음 <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- 캔버스 영역 -->
            <div class="canvas-box flex items-center justify-center">
                <canvas id="colorCanvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
                <canvas id="outlineCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
                
                <!-- 리액션 오버레이 -->
                <div id="reactionOverlay" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center transition-all duration-500 opacity-0 z-20 bg-black/10">
                    <div id="reactionEmoji" class="text-5xl animate-bounce mb-1">🌟</div>
                    <div id="reactionText" class="bg-white/95 px-4 py-1.5 rounded-xl shadow-lg text-emerald-700 font-extrabold text-sm border-2 border-yellow-400">
                        참 잘했어요! 🦖
                    </div>
                </div>
            </div>

            <!-- 안내 문구 -->
            <div class="w-full bg-amber-100 text-amber-900 px-3 py-1.5 rounded-xl font-bold text-xs text-center flex items-center justify-center gap-1.5 border border-amber-300">
                <i class="fa-solid fa-paintbrush text-emerald-600 animate-pulse"></i>
                <span>마우스나 펜을 갖다 대기만 해도 슥슥 그려져요! ✨</span>
            </div>

            <!-- 컬러 팔레트 -->
            <div class="w-full bg-white p-2.5 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1">
                <div class="text-[11px] font-bold text-slate-500 px-1 flex justify-between items-center">
                    <span>🎨 색상 고르기</span>
                    <span id="selectedColorIndicator" class="w-3.5 h-3.5 rounded-full inline-block border border-slate-300" style="background-color: #ef4444;"></span>
                </div>
                <div class="flex justify-between items-center gap-1 px-1">
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-red-500 active ring-4 ring-emerald-400" data-color="#ef4444"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-orange-500" data-color="#f97316"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-yellow-400" data-color="#facc15"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-green-500" data-color="#22c55e"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-blue-500" data-color="#3b82f6"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-indigo-500" data-color="#6366f1"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-purple-500" data-color="#a855f7"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-pink-500" data-color="#ec4899"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-amber-800" data-color="#92400e"></div>
                </div>
            </div>

            <!-- 하단 도구 및 완료 버튼 -->
            <div class="w-full bg-white p-2 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1.5">
                <div class="flex justify-around items-center gap-1.5">
                    <button id="toolBrush" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-emerald-500 text-white shadow-sm">
                        <i class="fa-solid fa-paintbrush text-xs"></i> 붓
                    </button>
                    <button id="toolEraser" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                        <i class="fa-solid fa-eraser text-xs"></i> 지우개
                    </button>
                    <button id="toolReset" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                        <i class="fa-solid fa-rotate-right text-xs"></i> 다시하기
                    </button>
                    <button id="toolComplete" class="flex-[1.4] py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 shadow-md border border-yellow-300">
                        <i class="fa-solid fa-star text-xs animate-spin"></i> 완료! 🌟
                    </button>
                </div>
                <div class="flex items-center gap-2 px-1">
                    <span class="text-[11px] font-bold text-slate-500 whitespace-nowrap">두께:</span>
                    <input type="range" id="brushSizeRange" min="10" max="50" value="25" class="w-full accent-emerald-500 cursor-pointer h-1">
                </div>
            </div>
        </div>

    </div>

    <!-- 점수 모달 -->
    <div id="scoreModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="scoreModalCard" class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-yellow-300 transform scale-90 transition-transform duration-300 flex flex-col gap-4">
            <div id="modalEmoji" class="text-6xl animate-bounce">🏆</div>
            <div>
                <span id="praiseBadge" class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full uppercase">채점 결과</span>
                <h2 id="scoreValue" class="text-3xl font-black text-emerald-600 mt-2">100점</h2>
                <p id="praiseMessage" class="text-slate-600 text-sm font-bold mt-2">바탕까지 완벽하게 칠했어요!</p>
            </div>
            <button onclick="closeScoreModal()" class="w-full py-3 bg-emerald-500 text-white font-bold rounded-xl transition">
                계속 색칠하기 🎨
            </button>
        </div>
    </div>

    <script>
        let currentDinoIndex = 0;
        let currentColor = '#ef4444';
        let currentTool = 'brush';
        let brushSize = 25;

        const colorCanvas = document.getElementById('colorCanvas');
        const outlineCanvas = document.getElementById('outlineCanvas');
        const ctxColor = colorCanvas.getContext('2d', { willReadFrequently: true });
        const ctxOutline = outlineCanvas.getContext('2d');

        const dinoNames = [
            "1. 티라노사우루스 (화산 배경)",
            "2. 트리케라톱스 (초원 배경)",
            "3. 브라키오사우루스 (산 배경)",
            "4. 프테라노돈 (바다 배경)",
            "5. 스테고사우루스 (숲 배경)"
        ];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ✨ 찰랑거리는 부드러운 별소리
        let lastStarTime = 0;
        function playStarSound() {
            try {
                const now = Date.now();
                if (now - lastStarTime < 180) return;
                lastStarTime = now;

                initAudio();
                const notes = [587.33, 739.99, 880, 1174.66];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.05));
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime + (index * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (index * 0.05) + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (index * 0.05));
                    osc.stop(audioCtx.currentTime + (index * 0.05) + 0.12);
                });
            } catch(e) {}
        }

        // 👏 박수 소리 (100점)
        function playClapSound() {
            try {
                initAudio();
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        if (!audioCtx) return;
                        const bufferSize = audioCtx.sampleRate * 0.12;
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j++) {
                            data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.3));
                        }
                        const noise = audioCtx.createBufferSource();
                        noise.buffer = buffer;
                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 1200;

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);
                        noise.start();
                    }, i * 90);
                }
            } catch(e) {}
        }

        // 🎉 환호 사운드 (120점)
        function playCheerSound() {
            try {
                initAudio();
                const cheerNotes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
                cheerNotes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.07));
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + (index * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.07) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (index * 0.07));
                    osc.stop(audioCtx.currentTime + (index * 0.07) + 0.25);
                });
            } catch(e) {}
        }

        // 🎨 색상 변경 뿅 소리
        function playColorChangeSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // 스테이지 전환 소리
        function playSwitchSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // 시작 버튼 이벤트
        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            playSwitchSound();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('flex');
            initCanvasSize();
        });

        function initCanvasSize() {
            const size = 500;
            colorCanvas.width = size;
            colorCanvas.height = size;
            outlineCanvas.width = size;
            outlineCanvas.height = size;
            drawCurrentDinoAndBackground();
        }

        // 🦖 귀여운 유아용 색칠놀이 도안 그리기 함수
        function drawCurrentDinoAndBackground() {
            ctxOutline.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
            ctxOutline.strokeStyle = '#1e293b';
            ctxOutline.fillStyle = '#1e293b';
            ctxOutline.lineWidth = 5;
            ctxOutline.lineCap = 'round';
            ctxOutline.lineJoin = 'round';

            if (currentDinoIndex === 0) {
                // ==========================================
                // 1. 티라노사우루스 (화산 배경)
                // ==========================================
                // [배경] 오른쪽 화산 & 분화구
                ctxOutline.beginPath();
                ctxOutline.moveTo(330, 470);
                ctxOutline.quadraticCurveTo(370, 350, 390, 260);
                ctxOutline.lineTo(435, 260);
                ctxOutline.quadraticCurveTo(455, 350, 490, 470);
                // 화산 용암 지그재그
                ctxOutline.moveTo(385, 285); ctxOutline.lineTo(400, 305); ctxOutline.lineTo(412, 285); ctxOutline.lineTo(425, 305); ctxOutline.lineTo(440, 285);
                // 화산 연기 구름
                ctxOutline.moveTo(412, 240); ctxOutline.arc(412, 225, 16, 0, Math.PI * 2);
                ctxOutline.moveTo(435, 210); ctxOutline.arc(435, 195, 20, 0, Math.PI * 2);
                ctxOutline.stroke();

                // [배경] 왼쪽 위 뭉게구름
                drawCloud(ctxOutline, 95, 85, 0.85);

                // [공룡] 티라노사우루스 몸통 & 머리
                ctxOutline.beginPath();
                // 머리 윗선 -> 주둥이
                ctxOutline.moveTo(195, 145);
                ctxOutline.bezierCurveTo(220, 110, 315, 115, 325, 165);
                // 윗턱 & 입 벌린 라인
                ctxOutline.quadraticCurveTo(328, 190, 265, 192);
                ctxOutline.lineTo(310, 212);
                // 아랫턱 -> 목
                ctxOutline.quadraticCurveTo(295, 232, 245, 225);
                // 배 -> 앞다리(오른쪽)
                ctxOutline.quadraticCurveTo(255, 275, 245, 330);
                // 오른쪽 뒷다리
                ctxOutline.lineTo(260, 415);
                ctxOutline.quadraticCurveTo(275, 430, 230, 430);
                ctxOutline.lineTo(215, 370);
                // 가랑이 -> 왼쪽 뒷다리
                ctxOutline.quadraticCurveTo(195, 375, 180, 370);
                ctxOutline.lineTo(175, 430);
                ctxOutline.quadraticCurveTo(130, 430, 145, 410);
                ctxOutline.lineTo(155, 345);
                // 긴 꼬리
                ctxOutline.bezierCurveTo(95, 345, 45, 300, 35, 245);
                ctxOutline.bezierCurveTo(75, 275, 120, 285, 155, 260);
                // 등 라인
                ctxOutline.quadraticCurveTo(165, 190, 195, 145);
                ctxOutline.stroke();

                // 티라노 앙증맞은 팔
                ctxOutline.beginPath();
                ctxOutline.moveTo(245, 250);
                ctxOutline.lineTo(280, 255);
                ctxOutline.lineTo(275, 268);
                ctxOutline.moveTo(280, 255);
                ctxOutline.lineTo(285, 265);
                ctxOutline.stroke();

                // 티라노 날카로운 이빨
                ctxOutline.beginPath();
                ctxOutline.moveTo(280, 192); ctxOutline.lineTo(286, 202); ctxOutline.lineTo(292, 191);
                ctxOutline.moveTo(302, 190); ctxOutline.lineTo(308, 200); ctxOutline.lineTo(314, 188);
                ctxOutline.stroke();

                // 티라노 눈 & 콧구멍
                drawCuteEye(ctxOutline, 240, 152);
                ctxOutline.beginPath();
                ctxOutline.arc(305, 155, 3, 0, Math.PI * 2);
                ctxOutline.fill();

                // 바닥 선
                drawGroundLine(ctxOutline);

            } else if (currentDinoIndex === 1) {
                // ==========================================
                // 2. 트리케라톱스 (초원 배경)
                // ==========================================
                // [배경] 오른쪽 큰 나무
                ctxOutline.beginPath();
                ctxOutline.moveTo(405, 470); ctxOutline.lineTo(412, 320);
                ctxOutline.moveTo(435, 470); ctxOutline.lineTo(428, 320);
                ctxOutline.stroke();
                ctxOutline.beginPath();
                ctxOutline.arc(420, 270, 55, 0, Math.PI * 2);
                ctxOutline.stroke();

                // [배경] 구름
                drawCloud(ctxOutline, 110, 80, 0.9);

                // [공룡] 트리케라톱스 프릴(목장식)
                ctxOutline.beginPath();
                ctxOutline.moveTo(210, 180);
                ctxOutline.bezierCurveTo(175, 115, 265, 105, 275, 175);
                ctxOutline.stroke();

                // 코 위 뿔 & 이마 뿔
                ctxOutline.beginPath();
                ctxOutline.moveTo(270, 165); ctxOutline.lineTo(325, 135); ctxOutline.lineTo(280, 185);
                ctxOutline.moveTo(320, 215); ctxOutline.lineTo(348, 195); ctxOutline.lineTo(332, 230);
                ctxOutline.stroke();

                // 머리 & 몸통 & 다리
                ctxOutline.beginPath();
                ctxOutline.moveTo(275, 175);
                // 주둥이(부리)
                ctxOutline.quadraticCurveTo(345, 200, 340, 245);
                ctxOutline.quadraticCurveTo(320, 268, 275, 260);
                // 가슴 -> 앞다리
                ctxOutline.lineTo(275, 360);
                ctxOutline.quadraticCurveTo(275, 375, 240, 375);
                ctxOutline.lineTo(235, 325);
                // 배
                ctxOutline.quadraticCurveTo(190, 330, 155, 325);
                // 뒷다리
                ctxOutline.lineTo(150, 375);
                ctxOutline.quadraticCurveTo(115, 375, 115, 360);
                ctxOutline.lineTo(115, 295);
                // 꼬리
                ctxOutline.quadraticCurveTo(60, 290, 45, 260);
                ctxOutline.quadraticCurveTo(75, 245, 110, 240);
                // 등 곡선
                ctxOutline.bezierCurveTo(130, 185, 180, 175, 210, 180);
                ctxOutline.stroke();

                // 귀여운 눈 & 미소
                drawCuteEye(ctxOutline, 280, 205);
                ctxOutline.beginPath();
                ctxOutline.arc(305, 238, 12, 0.2, Math.PI * 0.8);
                ctxOutline.stroke();

                // 바닥 선 & 풀숲
                drawGroundLine(ctxOutline);

            } else if (currentDinoIndex === 2) {
                // ==========================================
                // 3. 브라키오사우루스 (산과 태양 배경)
                // ==========================================
                // [배경] 왼쪽 산봉우리 & 오른쪽 태양
                ctxOutline.beginPath();
                ctxOutline.moveTo(20, 470); ctxOutline.lineTo(100, 280); ctxOutline.lineTo(175, 470);
                ctxOutline.moveTo(110, 470); ctxOutline.lineTo(175, 320); ctxOutline.lineTo(240, 470);
                ctxOutline.stroke();

                // 반짝이는 태양
                ctxOutline.beginPath();
                ctxOutline.arc(415, 85, 32, 0, Math.PI * 2);
                ctxOutline.stroke();
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    ctxOutline.beginPath();
                    ctxOutline.moveTo(415 + Math.cos(a) * 40, 85 + Math.sin(a) * 40);
                    ctxOutline.lineTo(415 + Math.cos(a) * 52, 85 + Math.sin(a) * 52);
                    ctxOutline.stroke();
                }

                // [공룡] 긴 목 브라키오사우루스
                ctxOutline.beginPath();
                // 머리 윗부분 (특징적인 둥근 혹)
                ctxOutline.moveTo(295, 105);
                ctxOutline.bezierCurveTo(310, 75, 355, 80, 365, 115);
                // 주둥이
                ctxOutline.quadraticCurveTo(385, 130, 360, 148);
                ctxOutline.lineTo(325, 148);
                // 긴 목 앞선 -> 가슴
                ctxOutline.quadraticCurveTo(315, 230, 335, 285);
                // 앞다리 (길쭉함)
                ctxOutline.lineTo(335, 425);
                ctxOutline.quadraticCurveTo(335, 440, 300, 440);
                ctxOutline.lineTo(295, 355);
                // 배
                ctxOutline.quadraticCurveTo(245, 365, 200, 355);
                // 뒷다리
                ctxOutline.lineTo(195, 440);
                ctxOutline.quadraticCurveTo(160, 440, 160, 425);
                ctxOutline.lineTo(160, 330);
                // 긴 꼬리
                ctxOutline.bezierCurveTo(95, 335, 55, 300, 45, 265);
                ctxOutline.bezierCurveTo(85, 285, 125, 285, 165, 265);
                // 등 -> 긴 목 뒷선
                ctxOutline.bezierCurveTo(215, 245, 275, 195, 295, 105);
                ctxOutline.stroke();

                // 눈 & 미소
                drawCuteEye(ctxOutline, 335, 112);
                ctxOutline.beginPath();
                ctxOutline.arc(352, 132, 10, 0.1, Math.PI * 0.85);
                ctxOutline.stroke();

                drawGroundLine(ctxOutline);

            } else if (currentDinoIndex === 3) {
                // ==========================================
                // 4. 프테라노돈 (바다 배경)
                // ==========================================
                // [배경] 구름 & 갈매기
                drawCloud(ctxOutline, 95, 75, 0.8);
                drawCloud(ctxOutline, 405, 95, 0.75);

                // [배경] 하단 바다 파도 2줄
                ctxOutline.beginPath();
                for (let x = 20; x <= 440; x += 60) {
                    ctxOutline.moveTo(x, 425);
                    ctxOutline.quadraticCurveTo(x + 30, 400, x + 60, 425);
                    ctxOutline.moveTo(x + 15, 455);
                    ctxOutline.quadraticCurveTo(x + 45, 430, x + 75, 455);
                }
                ctxOutline.stroke();

                // [공룡] 하늘을 나는 프테라노돈
                ctxOutline.beginPath();
                // 머리 뒤 뾰족한 볏
                ctxOutline.moveTo(220, 190);
                ctxOutline.lineTo(135, 155);
                ctxOutline.lineTo(210, 225);
                // 긴 부리
                ctxOutline.lineTo(355, 235);
                ctxOutline.lineTo(245, 255);
                ctxOutline.stroke();

                // 몸통
                ctxOutline.beginPath();
                ctxOutline.ellipse(225, 275, 32, 48, -0.2, 0, Math.PI * 2);
                ctxOutline.stroke();

                // 왼쪽 커다란 날개
                ctxOutline.beginPath();
                ctxOutline.moveTo(195, 255);
                ctxOutline.bezierCurveTo(120, 185, 55, 215, 40, 275);
                ctxOutline.quadraticCurveTo(100, 270, 130, 295);
                ctxOutline.quadraticCurveTo(165, 285, 198, 295);
                ctxOutline.stroke();

                // 오른쪽 커다란 날개
                ctxOutline.beginPath();
                ctxOutline.moveTo(255, 260);
                ctxOutline.bezierCurveTo(335, 195, 415, 215, 455, 275);
                ctxOutline.quadraticCurveTo(395, 275, 365, 300);
                ctxOutline.quadraticCurveTo(310, 290, 255, 300);
                ctxOutline.stroke();

                // 귀여운 발 2개
                ctxOutline.beginPath();
                ctxOutline.moveTo(210, 320); ctxOutline.lineTo(200, 345);
                ctxOutline.moveTo(235, 322); ctxOutline.lineTo(240, 348);
                ctxOutline.stroke();

                drawCuteEye(ctxOutline, 240, 215);

            } else {
                // ==========================================
                // 5. 스테고사우루스 (숲 배경)
                // ==========================================
                // [배경] 왼쪽 침엽수 숲 나무 & 구름
                ctxOutline.beginPath();
                ctxOutline.moveTo(75, 470); ctxOutline.lineTo(75, 390);
                ctxOutline.moveTo(30, 390); ctxOutline.lineTo(75, 310); ctxOutline.lineTo(120, 390); ctxOutline.closePath();
                ctxOutline.moveTo(40, 330); ctxOutline.lineTo(75, 260); ctxOutline.lineTo(110, 330); ctxOutline.closePath();
                ctxOutline.stroke();

                drawCloud(ctxOutline, 395, 80, 0.85);

                // [공룡] 스테고사우루스 몸통 & 작은 머리
                ctxOutline.beginPath();
                // 작은 머리 (오른쪽 방향)
                ctxOutline.moveTo(355, 280);
                ctxOutline.bezierCurveTo(385, 265, 425, 280, 420, 310);
                ctxOutline.quadraticCurveTo(400, 328, 355, 320);
                // 앞다리
                ctxOutline.lineTo(345, 415);
                ctxOutline.quadraticCurveTo(345, 430, 310, 430);
                ctxOutline.lineTo(305, 365);
                // 배
                ctxOutline.quadraticCurveTo(255, 375, 210, 365);
                // 뒷다리
                ctxOutline.lineTo(205, 430);
                ctxOutline.quadraticCurveTo(170, 430, 170, 415);
                ctxOutline.lineTo(170, 345);
                // 꼬리 & 꼬리 끝 가시 2쌍
                ctxOutline.quadraticCurveTo(105, 345, 75, 315);
                ctxOutline.lineTo(50, 295); ctxOutline.lineTo(82, 305);
                ctxOutline.lineTo(65, 275); ctxOutline.lineTo(98, 295);
                // 둥글게 솟은 등 라인
                ctxOutline.bezierCurveTo(155, 215, 285, 215, 355, 280);
                ctxOutline.stroke();

                // 등에 솟아난 다이아몬드 모양 골판 5개
                const plates = [
                    { x: 145, y: 268, angle: -0.45 },
                    { x: 185, y: 238, angle: -0.2 },
                    { x: 235, y: 226, angle: 0 },
                    { x: 285, y: 236, angle: 0.2 },
                    { x: 325, y: 258, angle: 0.45 }
                ];
                plates.forEach(p => {
                    ctxOutline.save();
                    ctxOutline.translate(p.x, p.y);
                    ctxOutline.rotate(p.angle);
                    ctxOutline.beginPath();
                    ctxOutline.moveTo(-14, 0);
                    ctxOutline.lineTo(0, -34);
                    ctxOutline.lineTo(14, 0);
                    ctxOutline.stroke();
                    ctxOutline.restore();
                });

                drawCuteEye(ctxOutline, 392, 290);
                drawGroundLine(ctxOutline);
            }
        }

        // 보조 그리기 함수: 귀여운 눈
        function drawCuteEye(ctx, x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x - 2, y - 2, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 보조 그리기 함수: 뭉게구름
        function drawCloud(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(-22, 5, 16, Math.PI * 0.5, Math.PI * 1.5);
            ctx.arc(0, -8, 22, Math.PI, Math.PI * 2);
            ctx.arc(24, 5, 16, Math.PI * 1.5, Math.PI * 0.5);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // 보조 그리기 함수: 바닥선
        function drawGroundLine(ctx) {
            ctx.beginPath();
            ctx.moveTo(20, 470);
            ctx.lineTo(480, 470);
            ctx.stroke();
        }

        function getTouchPos(e) {
            const rect = colorCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (colorCanvas.width / rect.width),
                y: (clientY - rect.top) * (colorCanvas.height / rect.height)
            };
        }

        // 🖱️ 펜이나 마우스를 누르지 않고 갖다 대기만 해도 그려지는 로직
        let lastX = null;
        let lastY = null;

        function handleMove(e) {
            e.preventDefault();
            const pos = getTouchPos(e);

            ctxColor.beginPath();
            if (lastX !== null && lastY !== null) {
                ctxColor.moveTo(lastX, lastY);
            } else {
                ctxColor.moveTo(pos.x, pos.y);
            }
            ctxColor.lineTo(pos.x, pos.y);
            ctxColor.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            ctxColor.lineWidth = brushSize;
            ctxColor.lineCap = 'round';
            ctxColor.lineJoin = 'round';
            ctxColor.stroke();

            lastX = pos.x;
            lastY = pos.y;

            playStarSound();
        }

        function resetPosition() {
            lastX = null;
            lastY = null;
        }

        colorCanvas.addEventListener('mousemove', handleMove);
        colorCanvas.addEventListener('mouseleave', resetPosition);
        colorCanvas.addEventListener('touchmove', handleMove, { passive: false });
        colorCanvas.addEventListener('touchend', resetPosition);

        // 색상 변경 이벤트
        document.querySelectorAll('.color-bubble').forEach(bubble => {
            bubble.addEventListener('click', (e) => {
                initAudio();
                playColorChangeSound();
                document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('active', 'ring-4', 'ring-emerald-400'));
                e.target.classList.add('active', 'ring-4', 'ring-emerald-400');
                currentColor = e.target.getAttribute('data-color');
                document.getElementById('selectedColorIndicator').style.backgroundColor = currentColor;
                currentTool = 'brush';
            });
        });

        document.getElementById('toolBrush').addEventListener('click', () => { initAudio(); currentTool = 'brush'; });
        document.getElementById('toolEraser').addEventListener('click', () => { initAudio(); currentTool = 'eraser'; });
        document.getElementById('toolReset').addEventListener('click', () => { initAudio(); ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height); });
        document.getElementById('brushSizeRange').addEventListener('input', (e) => { brushSize = e.target.value; });

        document.getElementById('nextBtn').addEventListener('click', () => { 
            playSwitchSound();
            currentDinoIndex = (currentDinoIndex + 1) % 5; 
            document.getElementById('dinoName').innerText = dinoNames[currentDinoIndex];
            updateDinoInfo(); 
        });

        document.getElementById('prevBtn').addEventListener('click', () => { 
            playSwitchSound();
            currentDinoIndex = (currentDinoIndex + 4) % 5; 
            document.getElementById('dinoName').innerText = dinoNames[currentDinoIndex];
            updateDinoInfo(); 
        });

        function updateDinoInfo() {
            ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
            drawCurrentDinoAndBackground();
        }

        // 🏆 완료 버튼 채점 알고리즘 (50점 / 100점 / 120점)
        document.getElementById('toolComplete').addEventListener('click', () => {
            initAudio();

            const imageData = ctxColor.getImageData(0, 0, 500, 500);
            const data = imageData.data;
            let coloredPixels = 0;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] > 0) coloredPixels++;
            }

            let score = 50;
            let badgeText = "공룡 색칠 완료!";
            let msgText = "공룡 캐릭터를 예쁘게 잘 칠했어요! (50점)";
            let emoji = "🦖";

            if (coloredPixels > 25000) {
                score = 100;
                badgeText = "바탕까지 완벽 정복!";
                msgText = "공룡과 바탕까지 다 색칠했어요! (100점)";
                emoji = "👏";
                playClapSound();
            }
            if (coloredPixels > 55000) {
                score = 120;
                badgeText = "창의력 만점 천재 화가!";
                msgText = "나만의 멋진 작품을 창의적으로 완성했어요! (120점 만점)";
                emoji = "🎉";
                playCheerSound();
            }

            if (score === 50) {
                playStarSound();
            }

            document.getElementById('scoreValue').innerText = score + "점";
            document.getElementById('praiseBadge').innerText = badgeText;
            document.getElementById('praiseMessage').innerText = msgText;
            document.getElementById('modalEmoji').innerText = emoji;

            const overlay = document.getElementById('reactionOverlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            if (typeof confetti === 'function') {
                confetti({ particleCount: score === 120 ? 180 : 100, spread: 90, origin: { y: 0.6 } });
            }

            setTimeout(() => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('scoreModal').classList.remove('opacity-0', 'pointer-events-none');
            }, 1200);
        });

        function closeScoreModal() {
            initAudio();
            document.getElementById('scoreModal').classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
