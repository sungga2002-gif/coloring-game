<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1~4세 아기를 위한 AI 공룡 색칠놀이 웹 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcf8f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dino-game-wrapper {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            background-color: #fffdf5;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 3px solid #fde68a;
        }
        .color-bubble {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .color-bubble:hover, .color-bubble.active {
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            z-index: 10;
        }
        .canvas-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fcd34d;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="dino-game-wrapper flex flex-col gap-3">

        <!-- 🚀 1. 시작 메인 페이지 화면 -->
        <div id="startScreen" class="flex flex-col items-center justify-center py-12 px-4 text-center gap-6">
            <div class="text-7xl animate-bounce">🦖</div>
            <div>
                <h1 class="text-2xl font-black text-emerald-700">아기를 위한 공룡 색칠놀이</h1>
                <p class="text-slate-500 text-xs mt-2">공룡(50점), 바탕까지(100점), 창의적표현(120점) 만점에 도전하세요!</p>
            </div>
            <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 font-black text-lg rounded-2xl shadow-lg border-2 border-yellow-300 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 색칠놀이 시작하기!
            </button>
        </div>

        <!-- 🎨 2. 게임 플레이 화면 (처기엔 숨김) -->
        <div id="gameScreen" class="hidden flex-col gap-3">
            <!-- 상단 헤더 & 스테이지 바 -->
            <div class="flex justify-between items-center bg-white px-3 py-2 rounded-xl shadow-sm border border-amber-200">
                <button id="prevBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-chevron-left"></i> 이전
                </button>
                <div class="text-center">
                    <span id="dinoName" class="text-sm font-black text-emerald-700">1. 티라노사우루스 (화산 배경)</span>
                </div>
                <button id="nextBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                    다음 <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- 캔버스 영역 -->
            <div class="canvas-box flex items-center justify-center">
                <canvas id="colorCanvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
                <canvas id="outlineCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
                
                <!-- 리액션 오버레이 -->
                <div id="reactionOverlay" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center transition-all duration-500 opacity-0 z-20 bg-black/10">
                    <div id="reactionEmoji" class="text-5xl animate-bounce mb-1">🌟</div>
                    <div id="reactionText" class="bg-white/95 px-4 py-1.5 rounded-xl shadow-lg text-emerald-700 font-extrabold text-sm border-2 border-yellow-400">
                        참 잘했어요! 🦖
                    </div>
                </div>
            </div>

            <!-- 안내 문구 -->
            <div class="w-full bg-amber-100 text-amber-900 px-3 py-1.5 rounded-xl font-bold text-xs text-center flex items-center justify-center gap-1.5 border border-amber-300">
                <i class="fa-solid fa-paintbrush text-emerald-600 animate-pulse"></i>
                <span>공룡만(50점) / 바탕까지(100점) / 창의적표현(120점)</span>
            </div>

            <!-- 컬러 팔레트 -->
            <div class="w-full bg-white p-2.5 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1">
                <div class="text-[11px] font-bold text-slate-500 px-1 flex justify-between items-center">
                    <span>🎨 색상 고르기</span>
                    <span id="selectedColorIndicator" class="w-3.5 h-3.5 rounded-full inline-block border border-slate-300" style="background-color: #ef4444;"></span>
                </div>
                <div class="flex justify-between items-center gap-1 px-1">
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-red-500 active ring-4 ring-emerald-400" data-color="#ef4444"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-orange-500" data-color="#f97316"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-yellow-400" data-color="#facc15"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-green-500" data-color="#22c55e"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-blue-500" data-color="#3b82f6"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-indigo-500" data-color="#6366f1"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-purple-500" data-color="#a855f7"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-pink-500" data-color="#ec4899"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-amber-800" data-color="#92400e"></div>
                </div>
            </div>

            <!-- 하단 도구 및 완료 버튼 -->
            <div class="w-full bg-white p-2 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1.5">
                <div class="flex justify-around items-center gap-1.5">
                    <button id="toolBrush" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-emerald-500 text-white shadow-sm">
                        <i class="fa-solid fa-paintbrush text-xs"></i> 붓
                    </button>
                    <button id="toolEraser" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                        <i class="fa-solid fa-eraser text-xs"></i> 지우개
                    </button>
                    <button id="toolReset" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                        <i class="fa-solid fa-rotate-right text-xs"></i> 다시하기
                    </button>
                    <button id="toolComplete" class="flex-[1.4] py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 shadow-md border border-yellow-300">
                        <i class="fa-solid fa-star text-xs animate-spin"></i> 완료! 🌟
                    </button>
                </div>
                <div class="flex items-center gap-2 px-1">
                    <span class="text-[11px] font-bold text-slate-500 whitespace-nowrap">두께:</span>
                    <input type="range" id="brushSizeRange" min="10" max="50" value="25" class="w-full accent-emerald-500 cursor-pointer h-1">
                </div>
            </div>
        </div>

    </div>

    <!-- 점수 모달 -->
    <div id="scoreModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="scoreModalCard" class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-yellow-300 transform scale-90 transition-transform duration-300 flex flex-col gap-4">
            <div id="modalEmoji" class="text-6xl animate-bounce">🏆</div>
            <div>
                <span id="praiseBadge" class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full uppercase">채점 결과</span>
                <h2 id="scoreValue" class="text-3xl font-black text-emerald-600 mt-2">100점</h2>
                <p id="praiseMessage" class="text-slate-600 text-sm font-bold mt-2">바탕까지 완벽하게 칠했어요!</p>
            </div>
            <button onclick="closeScoreModal()" class="w-full py-3 bg-emerald-500 text-white font-bold rounded-xl transition">
                계속 색칠하기 🎨
            </button>
        </div>
    </div>

    <script>
        let currentDinoIndex = 0;
        let currentColor = '#ef4444';
        let currentTool = 'brush';
        let brushSize = 25;
        let isDrawing = false;

        const colorCanvas = document.getElementById('colorCanvas');
        const outlineCanvas = document.getElementById('outlineCanvas');
        const ctxColor = colorCanvas.getContext('2d', { willReadFrequently: true });
        const ctxOutline = outlineCanvas.getContext('2d');

        const dinoNames = [
            "1. 티라노사우루스 (화산 배경)",
            "2. 트리케라톱스 (초원 배경)",
            "3. 브라키오사우루스 (산 배경)",
            "4. 프테라노돈 (바다 배경)",
            "5. 스테고사우루스 (숲 배경)"
        ];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ✨ 1. 기본 별 소리 (50점 완료 시)
        function playStarSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; 
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.08));
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + (index * 0.08));
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.08) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (index * 0.08));
                    osc.stop(audioCtx.currentTime + (index * 0.08) + 0.2);
                });
            } catch(e) {}
        }

        // 👏 2. 박수 소리 (100점 - 바탕까지 다 칠했을 때)
        function playClapSound() {
            try {
                initAudio();
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        if (!audioCtx) return;
                        const bufferSize = audioCtx.sampleRate * 0.12;
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j++) {
                            data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.3));
                        }
                        const noise = audioCtx.createBufferSource();
                        noise.buffer = buffer;
                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 1200;

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);
                        noise.start();
                    }, i * 90);
                }
            } catch(e) {}
        }

        // 🎉 3. 환호 사운드 (120점 - 창의적 만점)
        function playCheerSound() {
            try {
                initAudio();
                const cheerNotes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
                cheerNotes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.07));
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + (index * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.07) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (index * 0.07));
                    osc.stop(audioCtx.currentTime + (index * 0.07) + 0.25);
                });
            } catch(e) {}
        }

        // 🎨 4. 색상 변경 뿅 소리
        function playColorChangeSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // 스테이지 전환 소리
        function playSwitchSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // 시작 버튼 이벤트
        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            playSwitchSound();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('flex');
            initCanvasSize();
        });

        function initCanvasSize() {
            const size = 500;
            colorCanvas.width = size;
            colorCanvas.height = size;
            outlineCanvas.width = size;
            outlineCanvas.height = size;
            drawCurrentDinoAndBackground();
        }

        function drawCurrentDinoAndBackground() {
            ctxOutline.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
            ctxOutline.strokeStyle = '#1e293b';
            ctxOutline.lineWidth = 6;
            ctxOutline.lineCap = 'round';
            ctxOutline.lineJoin = 'round';

            const cx = 250, cy = 250;
            ctxOutline.beginPath();

            if (currentDinoIndex === 0) {
                ctxOutline.moveTo(320, 460); ctxOutline.lineTo(410, 270); ctxOutline.lineTo(470, 460);
                ctxOutline.moveTo(cx - 50, cy - 80); ctxOutline.lineTo(cx + 70, cy - 70); ctxOutline.lineTo(cx + 85, cy - 40);
                ctxOutline.lineTo(cx + 20, cy - 20); ctxOutline.lineTo(cx + 60, cy + 50); ctxOutline.lineTo(cx + 90, cy + 130);
                ctxOutline.lineTo(cx + 50, cy + 130); ctxOutline.lineTo(cx + 20, cy + 70); ctxOutline.lineTo(cx - 40, cy + 130);
                ctxOutline.lineTo(cx - 80, cy + 130); ctxOutline.lineTo(cx - 60, cy + 60); ctxOutline.lineTo(cx - 140, cy + 10);
                ctxOutline.lineTo(cx - 60, cy - 40); ctxOutline.closePath();
            } else if (currentDinoIndex === 1) {
                ctxOutline.arc(410, 340, 55, 0, Math.PI * 2);
                ctxOutline.moveTo(410, 395); ctxOutline.lineTo(410, 460);
                ctxOutline.arc(cx, cy + 20, 75, 0, Math.PI * 2);
                ctxOutline.moveTo(cx - 35, cy - 40); ctxOutline.bezierCurveTo(cx - 100, cy - 110, cx + 100, cy - 110, cx + 35, cy - 40);
            } else if (currentDinoIndex === 2) {
                ctxOutline.moveTo(40, 460); ctxOutline.lineTo(130, 270); ctxOutline.lineTo(220, 460);
                ctxOutline.moveTo(cx - 30, cy + 80); ctxOutline.lineTo(cx - 40, cy - 110);
                ctxOutline.arc(cx - 25, cy - 120, 15, Math.PI, Math.PI * 2.5);
                ctxOutline.ellipse(cx + 20, cy + 40, 75, 50, 0, 0, Math.PI * 2);
            } else if (currentDinoIndex === 3) {
                ctxOutline.moveTo(40, 440); ctxOutline.quadraticCurveTo(90, 410, 140, 440);
                ctxOutline.ellipse(cx, cy + 20, 30, 45, 0, 0, Math.PI * 2);
                ctxOutline.moveTo(cx, cy - 25); ctxOutline.lineTo(cx - 95, cy - 55);
            } else {
                ctxOutline.arc(80, 80, 15, 0, Math.PI * 2);
                ctxOutline.ellipse(cx, cy + 20, 85, 55, 0, 0, Math.PI * 2);
                ctxOutline.arc(cx - 90, cy + 15, 18, 0, Math.PI * 2);
            }
            ctxOutline.stroke();
        }

        function getTouchPos(e) {
            const rect = colorCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (colorCanvas.width / rect.width),
                y: (clientY - rect.top) * (colorCanvas.height / rect.height)
            };
        }

        function startDrawing(e) { 
            isDrawing = true; 
            const pos = getTouchPos(e); 
            ctxColor.beginPath(); 
            ctxColor.moveTo(pos.x, pos.y); 
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getTouchPos(e);
            ctxColor.lineTo(pos.x, pos.y);
            ctxColor.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            ctxColor.lineWidth = brushSize;
            ctxColor.lineCap = 'round';
            ctxColor.lineJoin = 'round';
            ctxColor.stroke();
        }
        function stopDrawing() { isDrawing = false; }

        colorCanvas.addEventListener('mousedown', startDrawing);
        colorCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        colorCanvas.addEventListener('touchstart', startDrawing, { passive: false });
        colorCanvas.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        // 색상 변경 이벤트 (색 변경 시 뿅 소리)
        document.querySelectorAll('.color-bubble').forEach(bubble => {
            bubble.addEventListener('click', (e) => {
                initAudio();
                playColorChangeSound();
                document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('active', 'ring-4', 'ring-emerald-400'));
                e.target.classList.add('active', 'ring-4', 'ring-emerald-400');
                currentColor = e.target.getAttribute('data-color');
                currentTool = 'brush';
            });
        });

        document.getElementById('toolBrush').addEventListener('click', () => { initAudio(); currentTool = 'brush'; });
        document.getElementById('toolEraser').addEventListener('click', () => { initAudio(); currentTool = 'eraser'; });
        document.getElementById('toolReset').addEventListener('click', () => { initAudio(); ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height); });
        document.getElementById('brushSizeRange').addEventListener('input', (e) => { brushSize = e.target.value; });

        document.getElementById('nextBtn').addEventListener('click', () => { 
            playSwitchSound();
            currentDinoIndex = (currentDinoIndex + 1) % 5; 
            document.getElementById('dinoName').innerText = dinoNames[currentDinoIndex];
            updateDinoInfo(); 
        });

        document.getElementById('prevBtn').addEventListener('click', () => { 
            playSwitchSound();
            currentDinoIndex = (currentDinoIndex + 4) % 5; 
            document.getElementById('dinoName').innerText = dinoNames[currentDinoIndex];
            updateDinoInfo(); 
        });

        function updateDinoInfo() {
            ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
            drawCurrentDinoAndBackground();
        }

        // 🏆 완료 버튼 채점 알고리즘 (50점 / 100점 / 120점)
        document.getElementById('toolComplete').addEventListener('click', () => {
            initAudio();

            const imageData = ctxColor.getImageData(0, 0, 500, 500);
            const data = imageData.data;
            let coloredPixels = 0;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] > 0) coloredPixels++;
            }

            let score = 50;
            let badgeText = "공룡 색칠 완료!";
            let msgText = "공룡 캐릭터를 예쁘게 잘 칠했어요! (50점)";
            let emoji = "🦖";

            if (coloredPixels > 15000) {
                // 바탕까지 다 색칠한 경우 (100점 + 박수소리)
                score = 100;
                badgeText = "바탕까지 완벽 정복!";
                msgText = "공룡과 바탕까지 다 색칠했어요! (100점)";
                emoji = "👏";
                playClapSound(); // 👏 박수 소리
            }
            if (coloredPixels > 35000) {
                // 창의적으로 임의대로 다양하게 채워 넣은 경우 (120점 + 환호 사운드)
                score = 120;
                badgeText = "창의력 만점 천재 화가!";
                msgText = "나만의 멋진 작품을 창의적으로 완성했어요! (120점 만점)";
                emoji = "🎉";
                playCheerSound(); // 🎉 환호 사운드
            }

            if (score === 50) {
                playStarSound(); // 50점은 기본 별 소리
            }

            document.getElementById('scoreValue').innerText = score + "점";
            document.getElementById('praiseBadge').innerText = badgeText;
            document.getElementById('praiseMessage').innerText = msgText;
            document.getElementById('modalEmoji').innerText = emoji;

            const overlay = document.getElementById('reactionOverlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            if (typeof confetti === 'function') {
                confetti({ particleCount: score === 120 ? 180 : 100, spread: 90, origin: { y: 0.6 } });
            }

            setTimeout(() => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('scoreModal').classList.remove('opacity-0', 'pointer-events-none');
            }, 1200);
        });

        function closeScoreModal() {
            initAudio();
            document.getElementById('scoreModal').classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
