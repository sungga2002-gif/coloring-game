<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1~4세 아기를 위한 AI 공룡 색칠놀이 웹 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcf8f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dino-game-wrapper {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            background-color: #fffdf5;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 3px solid #fde68a;
        }
        .color-bubble {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .color-bubble:hover, .color-bubble.active {
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            z-index: 10;
        }
        .canvas-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fcd34d;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="dino-game-wrapper flex flex-col gap-3">

        <!-- 🚀 1. 시작 메인 페이지 화면 -->
        <div id="startScreen" class="flex flex-col items-center justify-center py-12 px-4 text-center gap-6">
            <div class="text-7xl animate-bounce">🦖</div>
            <div>
                <h1 class="text-2xl font-black text-emerald-700">아기를 위한 공룡 색칠놀이</h1>
                <p class="text-slate-500 text-xs mt-2">공룡만(50점), 바탕까지(100점), 창의적표현(120점) 만점에 도전하세요!</p>
            </div>
            <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 font-black text-lg rounded-2xl shadow-lg border-2 border-yellow-300 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 색칠놀이 시작하기!
            </button>
        </div>

        <!-- 🎨 2. 게임 플레이 화면 -->
        <div id="gameScreen" class="hidden flex-col gap-3">
            <!-- 상단 헤더 & 스테이지 바 -->
            <div class="flex justify-between items-center bg-white px-3 py-2 rounded-xl shadow-sm border border-amber-200">
                <button id="prevBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-chevron-left"></i> 이전
                </button>
                <div class="text-center">
                    <span id="dinoName" class="text-sm font-black text-emerald-700">1. 티라노사우루스 (화산 배경)</span>
                </div>
                <button id="nextBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-lg font-bold text-xs transition active:scale-95 flex items-center gap-1">
                    다음 <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- 캔버스 영역 -->
            <div class="canvas-box flex items-center justify-center">
                <canvas id="colorCanvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
                <canvas id="outlineCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
                
                <!-- 리액션 오버레이 -->
                <div id="reactionOverlay" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center transition-all duration-500 opacity-0 z-20 bg-black/10">
                    <div id="reactionEmoji" class="text-5xl animate-bounce mb-1">🌟</div>
                    <div id="reactionText" class="bg-white/95 px-4 py-1.5 rounded-xl shadow-lg text-emerald-700 font-extrabold text-sm border-2 border-yellow-400">
                        참 잘했어요! 🦖
                    </div>
                </div>
            </div>

            <!-- 안내 문구 -->
            <div id="statusBanner" class="w-full bg-amber-100 text-amber-900 px-3 py-1.5 rounded-xl font-bold text-xs text-center flex items-center justify-center gap-1.5 border border-amber-300 transition-colors">
                <i class="fa-solid fa-paintbrush text-emerald-600 animate-pulse"></i>
                <span id="statusText">마우스나 펜을 움직이면 슥슥 그려져요! (멈추면 2.5초 휴식) ✨</span>
            </div>

            <!-- 컬러 팔레트 -->
            <div class="w-full bg-white p-2.5 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1">
                <div class="text-[11px] font-bold text-slate-500 px-1 flex justify-between items-center">
                    <span>🎨 색상 고르기</span>
                    <span id="selectedColorIndicator" class="w-3.5 h-3.5 rounded-full inline-block border border-slate-300" style="background-color: #ef4444;"></span>
                </div>
                <div class="flex justify-between items-center gap-1 px-1">
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-red-500 active ring-4 ring-emerald-400" data-color="#ef4444"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-orange-500" data-color="#f97316"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-yellow-400" data-color="#facc15"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-green-500" data-color="#22c55e"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-blue-500" data-color="#3b82f6"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-indigo-500" data-color="#6366f1"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-purple-500" data-color="#a855f7"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-pink-500" data-color="#ec4899"></div>
                    <div class="color-bubble w-6 h-6 rounded-full cursor-pointer border-2 border-white shadow bg-amber-800" data-color="#92400e"></div>
                </div>
            </div>

            <!-- 하단 도구 및 완료 버튼 -->
            <div class="w-full bg-white p-2 rounded-xl shadow-sm border border-amber-200 flex flex-col gap-1.5">
                <div class="flex justify-around items-center gap-1.5">
                    <button id="toolBrush" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-emerald-500 text-white shadow-sm">
                        <i class="fa-solid fa-paintbrush text-xs"></i> 붓
                    </button>
                    <button id="toolEraser" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                        <i class="fa-solid fa-eraser text-xs"></i> 지우개
                    </button>
                    <button id="toolReset" class="flex-1 py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
                        <i class="fa-solid fa-rotate-right text-xs"></i> 다시하기
                    </button>
                    <button id="toolComplete" class="flex-[1.4] py-1.5 rounded-xl font-bold text-xs flex flex-col items-center gap-0.5 transition bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 shadow-md border border-yellow-300">
                        <i class="fa-solid fa-star text-xs animate-spin"></i> 완료! 🌟
                    </button>
                </div>
                <div class="flex items-center gap-2 px-1">
                    <span class="text-[11px] font-bold text-slate-500 whitespace-nowrap">두께:</span>
                    <input type="range" id="brushSizeRange" min="10" max="50" value="25" class="w-full accent-emerald-500 cursor-pointer h-1">
                </div>
            </div>
        </div>

    </div>

    <!-- 점수 모달 -->
    <div id="scoreModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="scoreModalCard" class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-yellow-300 transform scale-90 transition-transform duration-300 flex flex-col gap-4">
            <div id="modalEmoji" class="text-6xl animate-bounce">🏆</div>
            <div>
                <span id="praiseBadge" class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full uppercase">채점 결과</span>
                <h2 id="scoreValue" class="text-3xl font-black text-emerald-600 mt-2">100점</h2>
                <p id="praiseMessage" class="text-slate-600 text-sm font-bold mt-2">바탕까지 완벽하게 칠했어요!</p>
            </div>
            <button onclick="closeScoreModal()" class="w-full py-3 bg-emerald-500 text-white font-bold rounded-xl transition">
                계속 색칠하기 🎨
            </button>
        </div>
    </div>

    <script>
        let currentDinoIndex = 0;
        let currentColor = '#ef4444';
        let currentTool = 'brush';
        let brushSize = 25;

        const colorCanvas = document.getElementById('colorCanvas');
        const outlineCanvas = document.getElementById('outlineCanvas');
        const ctxColor = colorCanvas.getContext('2d', { willReadFrequently: true });
        const ctxOutline = outlineCanvas.getContext('2d');

        const dinoNames = [
            "1. 티라노사우루스 (화산 배경)",
            "2. 트리케라톱스 (초원 배경)",
            "3. 브라키오사우루스 (산 배경)",
            "4. 프테라노돈 (바다 배경)",
            "5. 스테고사우루스 (숲 배경)"
        ];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ✨ 천천히 잔잔하게 울리는 별소리 (0.8초 간격, 부드러운 음색)
        let lastStarTime = 0;
        function playStarSound(force = false) {
            try {
                const now = Date.now();
                if (!force && now - lastStarTime < 800) return; // 0.8초마다 천천히 재생
                lastStarTime = now;

                initAudio();
                const notes = [587.33, 739.99, 880, 1174.66]; // D5, F#5, A5, D6
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.09));
                    gain.gain.setValueAtTime(force ? 0.16 : 0.045, audioCtx.currentTime + (index * 0.09));
                    gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + (index * 0.09) + 0.28);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (index * 0.09));
                    osc.stop(audioCtx.currentTime + (index * 0.09) + 0.28);
                });
            } catch(e) {}
        }

        // 👏 박수 소리 (100점)
        function playClapSound() {
            try {
                initAudio();
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        if (!audioCtx) return;
                        const bufferSize = audioCtx.sampleRate * 0.12;
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j++) {
                            data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.3));
                        }
                        const noise = audioCtx.createBufferSource();
                        noise.buffer = buffer;
                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 1200;

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);
                        noise.start();
                    }, i * 90);
                }
            } catch(e) {}
        }

        // 🎉 환호 사운드 (120점)
        function playCheerSound() {
            try {
                initAudio();
                const cheerNotes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
                cheerNotes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.07));
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + (index * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.07) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (index * 0.07));
                    osc.stop(audioCtx.currentTime + (index * 0.07) + 0.25);
                });
            } catch(e) {}
        }

        // 🎨 색상 변경 뿅 소리
        function playColorChangeSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // 스테이지 전환 소리
        function playSwitchSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // 시작 버튼 이벤트
        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            playSwitchSound();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('flex');
            initCanvasSize();
        });

        function initCanvasSize() {
            const size = 500;
            colorCanvas.width = size;
            colorCanvas.height = size;
            outlineCanvas.width = size;
            outlineCanvas.height = size;
            drawCurrentDinoAndBackground();
        }

        // 🦖 시판 컬러링북 수준의 디테일한 유아용 공룡 도안 그리기
        function drawCurrentDinoAndBackground() {
            ctxOutline.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
            ctxOutline.strokeStyle = '#1e293b';
            ctxOutline.fillStyle = '#1e293b';
            ctxOutline.lineWidth = 4.5;
            ctxOutline.lineCap = 'round';
            ctxOutline.lineJoin = 'round';

            if (currentDinoIndex === 0) {
                // ==========================================
                // 1. 아기 티라노사우루스 (화산 & 쥐라기 배경)
                // ==========================================
                ctxOutline.beginPath();
                ctxOutline.moveTo(335, 465);
                ctxOutline.bezierCurveTo(365, 380, 380, 300, 392, 255);
                ctxOutline.lineTo(432, 255);
                ctxOutline.bezierCurveTo(445, 300, 460, 380, 488, 465);
                ctxOutline.moveTo(388, 280);
                ctxOutline.quadraticCurveTo(396, 305, 405, 285);
                ctxOutline.quadraticCurveTo(412, 315, 420, 285);
                ctxOutline.quadraticCurveTo(428, 305, 436, 280);
                ctxOutline.stroke();

                drawCloud(ctxOutline, 415, 200, 0.55);
                drawCloud(ctxOutline, 445, 155, 0.7);
                drawCloud(ctxOutline, 95, 75, 0.85);

                drawFernBush(ctxOutline, 55, 465, 0.9);
                drawFernBush(ctxOutline, 325, 465, 0.75);

                ctxOutline.beginPath();
                ctxOutline.moveTo(190, 145);
                ctxOutline.bezierCurveTo(215, 100, 315, 102, 330, 152);
                ctxOutline.quadraticCurveTo(335, 182, 260, 188);
                ctxOutline.quadraticCurveTo(285, 212, 315, 208);
                ctxOutline.quadraticCurveTo(300, 232, 245, 224);
                ctxOutline.bezierCurveTo(265, 265, 265, 315, 248, 345);
                ctxOutline.lineTo(264, 412);
                ctxOutline.bezierCurveTo(282, 418, 280, 436, 230, 436);
                ctxOutline.lineTo(216, 376);
                ctxOutline.quadraticCurveTo(195, 382, 178, 374);
                ctxOutline.lineTo(172, 436);
                ctxOutline.bezierCurveTo(125, 436, 125, 418, 144, 410);
                ctxOutline.lineTo(155, 348);
                ctxOutline.bezierCurveTo(95, 352, 42, 310, 35, 250);
                ctxOutline.bezierCurveTo(75, 282, 122, 290, 155, 262);
                ctxOutline.bezierCurveTo(158, 210, 170, 175, 190, 145);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(238, 235);
                ctxOutline.bezierCurveTo(250, 275, 248, 315, 230, 352);
                ctxOutline.moveTo(240, 260); ctxOutline.lineTo(256, 260);
                ctxOutline.moveTo(243, 285); ctxOutline.lineTo(260, 285);
                ctxOutline.moveTo(240, 310); ctxOutline.lineTo(257, 310);
                ctxOutline.stroke();

                drawBackSpikes(ctxOutline, [
                    {x: 175, y: 175, a: -1.1},
                    {x: 162, y: 215, a: -1.3},
                    {x: 155, y: 255, a: -1.5},
                    {x: 112, y: 282, a: -2.1}
                ]);

                ctxOutline.beginPath();
                ctxOutline.moveTo(252, 246);
                ctxOutline.quadraticCurveTo(278, 244, 286, 256);
                ctxOutline.lineTo(278, 264);
                ctxOutline.moveTo(286, 256);
                ctxOutline.lineTo(288, 268);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(275, 187); ctxOutline.lineTo(281, 198); ctxOutline.lineTo(287, 186);
                ctxOutline.moveTo(294, 185); ctxOutline.lineTo(300, 196); ctxOutline.lineTo(306, 184);
                ctxOutline.moveTo(312, 182); ctxOutline.lineTo(317, 192); ctxOutline.lineTo(322, 179);
                ctxOutline.stroke();

                drawClaws(ctxOutline, 256, 436, 2);
                drawClaws(ctxOutline, 152, 436, 2);

                drawBigAnimeEye(ctxOutline, 238, 146, 11);
                ctxOutline.beginPath();
                ctxOutline.arc(310, 146, 3.5, 0, Math.PI * 2);
                ctxOutline.fill();

                drawGroundLine(ctxOutline);

            } else if (currentDinoIndex === 1) {
                // ==========================================
                // 2. 아기 트리케라톱스 (초원 & 잎사귀 나무 배경)
                // ==========================================
                ctxOutline.beginPath();
                ctxOutline.moveTo(405, 465); ctxOutline.quadraticCurveTo(412, 380, 410, 315);
                ctxOutline.moveTo(438, 465); ctxOutline.quadraticCurveTo(431, 380, 433, 315);
                ctxOutline.stroke();
                drawCloud(ctxOutline, 422, 265, 1.35);
                drawCloud(ctxOutline, 100, 75, 0.9);
                drawFernBush(ctxOutline, 58, 465, 0.95);
                drawFernBush(ctxOutline, 355, 465, 0.8);

                ctxOutline.beginPath();
                ctxOutline.moveTo(205, 182);
                ctxOutline.bezierCurveTo(165, 105, 265, 92, 276, 172);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.arc(205, 148, 9, 0, Math.PI * 2);
                ctxOutline.moveTo(234, 134); ctxOutline.arc(225, 134, 9, 0, Math.PI * 2);
                ctxOutline.moveTo(256, 148); ctxOutline.arc(247, 148, 9, 0, Math.PI * 2);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(265, 162); ctxOutline.quadraticCurveTo(305, 135, 332, 128); ctxOutline.quadraticCurveTo(308, 158, 278, 180);
                ctxOutline.moveTo(255, 152); ctxOutline.quadraticCurveTo(285, 125, 308, 120);
                ctxOutline.moveTo(324, 212); ctxOutline.quadraticCurveTo(345, 192, 356, 190); ctxOutline.quadraticCurveTo(348, 214, 336, 226);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(276, 172);
                ctxOutline.quadraticCurveTo(348, 196, 345, 245);
                ctxOutline.quadraticCurveTo(325, 272, 276, 262);
                ctxOutline.lineTo(278, 368);
                ctxOutline.bezierCurveTo(282, 382, 240, 382, 242, 368);
                ctxOutline.lineTo(238, 326);
                ctxOutline.moveTo(240, 355);
                ctxOutline.lineTo(222, 365);
                ctxOutline.bezierCurveTo(210, 372, 210, 355, 225, 340);
                ctxOutline.moveTo(238, 326);
                ctxOutline.quadraticCurveTo(192, 335, 154, 326);
                ctxOutline.lineTo(150, 368);
                ctxOutline.bezierCurveTo(152, 382, 110, 382, 114, 368);
                ctxOutline.lineTo(116, 296);
                ctxOutline.bezierCurveTo(65, 296, 40, 270, 38, 250);
                ctxOutline.bezierCurveTo(68, 248, 95, 245, 114, 236);
                ctxOutline.bezierCurveTo(132, 182, 180, 172, 205, 182);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.arc(155, 215, 10, 0, Math.PI * 2);
                ctxOutline.moveTo(192, 205); ctxOutline.arc(184, 205, 8, 0, Math.PI * 2);
                ctxOutline.moveTo(142, 245); ctxOutline.arc(135, 245, 7, 0, Math.PI * 2);
                ctxOutline.stroke();

                drawClaws(ctxOutline, 266, 378, 2);
                drawClaws(ctxOutline, 138, 378, 2);

                drawBigAnimeEye(ctxOutline, 282, 204, 11);
                ctxOutline.beginPath();
                ctxOutline.ellipse(306, 224, 8, 5, 0, 0, Math.PI * 2);
                ctxOutline.stroke();
                ctxOutline.beginPath();
                ctxOutline.arc(312, 240, 12, 0.2, Math.PI * 0.85);
                ctxOutline.stroke();

                drawGroundLine(ctxOutline);

            } else if (currentDinoIndex === 2) {
                // ==========================================
                // 3. 아기 브라키오사우루스 (산과 태양 배경)
                // ==========================================
                ctxOutline.beginPath();
                ctxOutline.moveTo(18, 465); ctxOutline.lineTo(98, 265); ctxOutline.lineTo(175, 465);
                ctxOutline.moveTo(74, 325); ctxOutline.lineTo(90, 338); ctxOutline.lineTo(102, 324); ctxOutline.lineTo(116, 336);
                ctxOutline.moveTo(115, 465); ctxOutline.lineTo(178, 310); ctxOutline.lineTo(242, 465);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.arc(415, 85, 30, 0, Math.PI * 2);
                ctxOutline.stroke();
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    ctxOutline.beginPath();
                    ctxOutline.moveTo(415 + Math.cos(a) * 38, 85 + Math.sin(a) * 38);
                    ctxOutline.lineTo(415 + Math.cos(a) * 50, 85 + Math.sin(a) * 50);
                    ctxOutline.stroke();
                }
                drawCloud(ctxOutline, 120, 75, 0.85);
                drawFernBush(ctxOutline, 420, 465, 0.9);

                ctxOutline.beginPath();
                ctxOutline.moveTo(292, 108);
                ctxOutline.bezierCurveTo(306, 70, 354, 72, 366, 112);
                ctxOutline.quadraticCurveTo(388, 128, 362, 148);
                ctxOutline.lineTo(324, 148);
                ctxOutline.bezierCurveTo(312, 210, 325, 255, 340, 290);
                ctxOutline.lineTo(340, 428);
                ctxOutline.bezierCurveTo(342, 444, 298, 444, 300, 428);
                ctxOutline.lineTo(296, 355);
                ctxOutline.quadraticCurveTo(248, 368, 200, 355);
                ctxOutline.lineTo(196, 428);
                ctxOutline.bezierCurveTo(198, 444, 156, 444, 158, 428);
                ctxOutline.lineTo(158, 332);
                ctxOutline.bezierCurveTo(95, 342, 42, 305, 36, 262);
                ctxOutline.bezierCurveTo(75, 286, 122, 288, 162, 265);
                ctxOutline.bezierCurveTo(218, 245, 275, 195, 292, 108);
                ctxOutline.stroke();

                const spots = [
                    {x: 304, y: 175, r: 7},
                    {x: 295, y: 215, r: 9},
                    {x: 265, y: 265, r: 11},
                    {x: 225, y: 280, r: 12},
                    {x: 185, y: 285, r: 9}
                ];
                spots.forEach(s => {
                    ctxOutline.beginPath();
                    ctxOutline.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctxOutline.stroke();
                });

                drawClaws(ctxOutline, 326, 442, 2);
                drawClaws(ctxOutline, 184, 442, 2);

                drawBigAnimeEye(ctxOutline, 336, 110, 10);
                ctxOutline.beginPath();
                ctxOutline.arc(354, 132, 10, 0.1, Math.PI * 0.85);
                ctxOutline.stroke();

                drawGroundLine(ctxOutline);

            } else if (currentDinoIndex === 3) {
                // ==========================================
                // 4. 아기 프테라노돈 (바다 & 섬 배경)
                // ==========================================
                drawCloud(ctxOutline, 95, 70, 0.85);
                drawCloud(ctxOutline, 405, 85, 0.8);

                ctxOutline.beginPath();
                ctxOutline.arc(425, 415, 48, Math.PI, 0);
                ctxOutline.moveTo(422, 368); ctxOutline.quadraticCurveTo(415, 330, 425, 305);
                ctxOutline.moveTo(425, 305); ctxOutline.quadraticCurveTo(400, 295, 388, 315);
                ctxOutline.moveTo(425, 305); ctxOutline.quadraticCurveTo(450, 295, 462, 315);
                ctxOutline.moveTo(425, 305); ctxOutline.quadraticCurveTo(410, 282, 398, 290);
                ctxOutline.moveTo(425, 305); ctxOutline.quadraticCurveTo(440, 282, 452, 290);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                for (let x = 20; x <= 440; x += 60) {
                    ctxOutline.moveTo(x, 420);
                    ctxOutline.quadraticCurveTo(x + 30, 396, x + 60, 420);
                    ctxOutline.moveTo(x + 15, 452);
                    ctxOutline.quadraticCurveTo(x + 45, 428, x + 75, 452);
                }
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(222, 185);
                ctxOutline.quadraticCurveTo(165, 162, 128, 152);
                ctxOutline.quadraticCurveTo(165, 195, 206, 222);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(222, 185);
                ctxOutline.quadraticCurveTo(255, 182, 266, 210);
                ctxOutline.lineTo(362, 228);
                ctxOutline.quadraticCurveTo(368, 236, 358, 242);
                ctxOutline.lineTo(254, 248);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(268, 232); ctxOutline.lineTo(340, 235);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.ellipse(226, 276, 34, 48, -0.15, 0, Math.PI * 2);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(195, 252);
                ctxOutline.bezierCurveTo(118, 175, 48, 205, 34, 272);
                ctxOutline.quadraticCurveTo(85, 265, 115, 290);
                ctxOutline.quadraticCurveTo(155, 278, 196, 292);
                ctxOutline.moveTo(194, 262); ctxOutline.quadraticCurveTo(125, 222, 72, 258);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(258, 256);
                ctxOutline.bezierCurveTo(338, 185, 418, 205, 462, 272);
                ctxOutline.quadraticCurveTo(405, 268, 372, 295);
                ctxOutline.quadraticCurveTo(315, 282, 258, 296);
                ctxOutline.moveTo(258, 266); ctxOutline.quadraticCurveTo(332, 225, 418, 260);
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.moveTo(212, 322); ctxOutline.lineTo(202, 348); ctxOutline.lineTo(192, 346);
                ctxOutline.moveTo(202, 348); ctxOutline.lineTo(208, 354);
                ctxOutline.moveTo(236, 324); ctxOutline.lineTo(242, 350); ctxOutline.lineTo(234, 356);
                ctxOutline.moveTo(242, 350); ctxOutline.lineTo(252, 348);
                ctxOutline.stroke();

                drawBigAnimeEye(ctxOutline, 242, 210, 10);

            } else {
                // ==========================================
                // 5. 아기 스테고사우루스 (숲 & 바위 배경)
                // ==========================================
                ctxOutline.beginPath();
                ctxOutline.moveTo(72, 465); ctxOutline.lineTo(72, 390);
                ctxOutline.moveTo(26, 390); ctxOutline.lineTo(72, 305); ctxOutline.lineTo(118, 390); ctxOutline.closePath();
                ctxOutline.moveTo(36, 328); ctxOutline.lineTo(72, 250); ctxOutline.lineTo(108, 328); ctxOutline.closePath();
                ctxOutline.stroke();

                ctxOutline.beginPath();
                ctxOutline.arc(432, 465, 36, Math.PI, 0);
                ctxOutline.moveTo(372, 465); ctxOutline.arc(394, 465, 22, Math.PI, 0);
                ctxOutline.stroke();

                drawCloud(ctxOutline, 395, 78, 0.85);

                ctxOutline.beginPath();
                ctxOutline.moveTo(356, 278);
                ctxOutline.bezierCurveTo(388, 260, 430, 276, 424, 310);
                ctxOutline.quadraticCurveTo(404, 330, 356, 322);
                ctxOutline.lineTo(348, 422);
                ctxOutline.bezierCurveTo(350, 436, 308, 436, 310, 422);
                ctxOutline.lineTo(306, 366);
                ctxOutline.quadraticCurveTo(255, 378, 208, 366);
                ctxOutline.lineTo(204, 422);
                ctxOutline.bezierCurveTo(206, 436, 166, 436, 168, 422);
                ctxOutline.lineTo(168, 346);
                ctxOutline.quadraticCurveTo(102, 348, 68, 315);
                ctxOutline.lineTo(42, 292); ctxOutline.lineTo(76, 302);
                ctxOutline.lineTo(58, 270); ctxOutline.lineTo(94, 292);
                ctxOutline.bezierCurveTo(155, 210, 288, 210, 356, 278);
                ctxOutline.stroke();

                const plates = [
                    { x: 138, y: 272, s: 0.85, angle: -0.52 },
                    { x: 178, y: 240, s: 1.0,  angle: -0.25 },
                    { x: 226, y: 226, s: 1.15, angle: -0.04 },
                    { x: 276, y: 232, s: 1.05, angle: 0.18 },
                    { x: 320, y: 254, s: 0.9,  angle: 0.42 }
                ];
                plates.forEach(p => {
                    ctxOutline.save();
                    ctxOutline.translate(p.x, p.y);
                    ctxOutline.rotate(p.angle);
                    ctxOutline.scale(p.s, p.s);
                    ctxOutline.beginPath();
                    ctxOutline.moveTo(-16, 0);
                    ctxOutline.quadraticCurveTo(-18, -22, 0, -40);
                    ctxOutline.quadraticCurveTo(18, -22, 16, 0);
                    ctxOutline.moveTo(0, -6);
                    ctxOutline.lineTo(0, -28);
                    ctxOutline.stroke();
                    ctxOutline.restore();
                });

                ctxOutline.beginPath();
                ctxOutline.arc(235, 295, 11, 0, Math.PI * 2);
                ctxOutline.moveTo(278, 305); ctxOutline.arc(270, 305, 8, 0, Math.PI * 2);
                ctxOutline.moveTo(205, 315); ctxOutline.arc(198, 315, 8, 0, Math.PI * 2);
                ctxOutline.stroke();

                drawClaws(ctxOutline, 336, 434, 2);
                drawClaws(ctxOutline, 192, 434, 2);

                drawBigAnimeEye(ctxOutline, 394, 288, 9);
                ctxOutline.beginPath();
                ctxOutline.arc(408, 308, 8, 0.2, Math.PI * 0.85);
                ctxOutline.stroke();

                drawGroundLine(ctxOutline);
            }
        }

        function drawBigAnimeEye(ctx, x, y, r) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.36, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x + r * 0.28, y + r * 0.28, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawClaws(ctx, x, y, count) {
            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const cx = x + (i * 11);
                ctx.moveTo(cx, y);
                ctx.arc(cx + 4, y, 4, Math.PI, 0);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawBackSpikes(ctx, list) {
            list.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.a);
                ctx.beginPath();
                ctx.moveTo(-8, 0);
                ctx.lineTo(0, -16);
                ctx.lineTo(8, 0);
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawFernBush(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.moveTo(-26, 0);
            ctx.quadraticCurveTo(-32, -22, -14, -26);
            ctx.quadraticCurveTo(-8, -42, 6, -34);
            ctx.quadraticCurveTo(24, -40, 22, -20);
            ctx.quadraticCurveTo(36, -15, 28, 0);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function drawCloud(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(-22, 5, 16, Math.PI * 0.5, Math.PI * 1.5);
            ctx.arc(0, -8, 22, Math.PI, Math.PI * 2);
            ctx.arc(24, 5, 16, Math.PI * 1.5, Math.PI * 0.5);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function drawGroundLine(ctx) {
            ctx.beginPath();
            ctx.moveTo(15, 465);
            ctx.lineTo(485, 465);
            ctx.stroke();
        }

        function getTouchPos(e) {
            const rect = colorCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (colorCanvas.width / rect.width),
                y: (clientY - rect.top) * (colorCanvas.height / rect.height)
            };
        }

        // 🖱️ 움직임 감지 및 멈춤 시 2.5초 휴식(쿨타임) 제어 로직
        let lastX = null;
        let lastY = null;
        let stopTimer = null;
        let isPaused = false;
        let resumeTimer = null;

        const statusBanner = document.getElementById('statusBanner');
        const statusText = document.getElementById('statusText');

        function setPausedState(paused) {
            isPaused = paused;
            lastX = null;
            lastY = null;
            if (paused) {
                statusBanner.classList.remove('bg-amber-100', 'text-amber-900', 'border-amber-300');
                statusBanner.classList.add('bg-slate-200', 'text-slate-600', 'border-slate-300');
                statusText.innerText = '잠깐 휴식 중! 2.5초 뒤 다시 칠해져요 ⏸️';
            } else {
                statusBanner.classList.remove('bg-slate-200', 'text-slate-600', 'border-slate-300');
                statusBanner.classList.add('bg-amber-100', 'text-amber-900', 'border-amber-300');
                statusText.innerText = '마우스나 펜을 움직이면 슥슥 그려져요! (멈추면 2.5초 휴식) ✨';
            }
        }

        function handleMove(e) {
            e.preventDefault();

            // 2.5초 휴식 시간 중에는 그리지 않음
            if (isPaused) return;

            const pos = getTouchPos(e);

            ctxColor.beginPath();
            if (lastX !== null && lastY !== null) {
                ctxColor.moveTo(lastX, lastY);
            } else {
                ctxColor.moveTo(pos.x, pos.y);
            }
            ctxColor.lineTo(pos.x, pos.y);
            ctxColor.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            ctxColor.lineWidth = brushSize;
            ctxColor.lineCap = 'round';
            ctxColor.lineJoin = 'round';
            ctxColor.stroke();

            lastX = pos.x;
            lastY = pos.y;

            playStarSound(false);

            // 움직임이 0.25초 동안 없으면 멈춘 것으로 간주 -> 2.5초 휴식 돌입
            clearTimeout(stopTimer);
            stopTimer = setTimeout(() => {
                setPausedState(true);
                clearTimeout(resumeTimer);
                resumeTimer = setTimeout(() => {
                    setPausedState(false);
                }, 2500);
            }, 250);
        }

        function resetPosition() {
            clearTimeout(stopTimer);
            lastX = null;
            lastY = null;
        }

        colorCanvas.addEventListener('mousemove', handleMove);
        colorCanvas.addEventListener('mouseleave', resetPosition);
        colorCanvas.addEventListener('touchmove', handleMove, { passive: false });
        colorCanvas.addEventListener('touchend', resetPosition);

        // 색상 변경 이벤트
        document.querySelectorAll('.color-bubble').forEach(bubble => {
            bubble.addEventListener('click', (e) => {
                initAudio();
                playColorChangeSound();
                document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('active', 'ring-4', 'ring-emerald-400'));
                e.target.classList.add('active', 'ring-4', 'ring-emerald-400');
                currentColor = e.target.getAttribute('data-color');
                document.getElementById('selectedColorIndicator').style.backgroundColor = currentColor;
                currentTool = 'brush';

                // 색상을 새로 고르면 바로 칠할 수 있도록 휴식 즉시 해제
                clearTimeout(stopTimer);
                clearTimeout(resumeTimer);
                setPausedState(false);
            });
        });

        document.getElementById('toolBrush').addEventListener('click', () => { initAudio(); currentTool = 'brush'; });
        document.getElementById('toolEraser').addEventListener('click', () => { initAudio(); currentTool = 'eraser'; });
        document.getElementById('toolReset').addEventListener('click', () => { initAudio(); ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height); });
        document.getElementById('brushSizeRange').addEventListener('input', (e) => { brushSize = e.target.value; });

        document.getElementById('nextBtn').addEventListener('click', () => { 
            playSwitchSound();
            currentDinoIndex = (currentDinoIndex + 1) % 5; 
            document.getElementById('dinoName').innerText = dinoNames[currentDinoIndex];
            updateDinoInfo(); 
        });

        document.getElementById('prevBtn').addEventListener('click', () => { 
            playSwitchSound();
            currentDinoIndex = (currentDinoIndex + 4) % 5; 
            document.getElementById('dinoName').innerText = dinoNames[currentDinoIndex];
            updateDinoInfo(); 
        });

        function updateDinoInfo() {
            ctxColor.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
            drawCurrentDinoAndBackground();
        }

        // 🏆 완료 버튼 채점 알고리즘 (50점 / 100점 / 120점)
        document.getElementById('toolComplete').addEventListener('click', () => {
            initAudio();

            const imageData = ctxColor.getImageData(0, 0, 500, 500);
            const data = imageData.data;
            let coloredPixels = 0;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] > 0) coloredPixels++;
            }

            let score = 50;
            let badgeText = "공룡 색칠 완료!";
            let msgText = "공룡 캐릭터를 예쁘게 잘 칠했어요! (50점)";
            let emoji = "🦖";

            if (coloredPixels > 25000) {
                score = 100;
                badgeText = "바탕까지 완벽 정복!";
                msgText = "공룡과 바탕까지 다 색칠했어요! (100점)";
                emoji = "👏";
                playClapSound();
            }
            if (coloredPixels > 55000) {
                score = 120;
                badgeText = "창의력 만점 천재 화가!";
                msgText = "나만의 멋진 작품을 창의적으로 완성했어요! (120점 만점)";
                emoji = "🎉";
                playCheerSound();
            }

            if (score === 50) {
                playStarSound(true);
            }

            document.getElementById('scoreValue').innerText = score + "점";
            document.getElementById('praiseBadge').innerText = badgeText;
            document.getElementById('praiseMessage').innerText = msgText;
            document.getElementById('modalEmoji').innerText = emoji;

            const overlay = document.getElementById('reactionOverlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            if (typeof confetti === 'function') {
                confetti({ particleCount: score === 120 ? 180 : 100, spread: 90, origin: { y: 0.6 } });
            }

            setTimeout(() => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('scoreModal').classList.remove('opacity-0', 'pointer-events-none');
            }, 1200);
        });

        function closeScoreModal() {
            initAudio();
            document.getElementById('scoreModal').classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
